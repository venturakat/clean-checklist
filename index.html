<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Start Tomorrow</title>
    
    <!-- PWA / Home Screen Support -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SortableJS for mobile-friendly drag and drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --hint-color: #999999;
            --button-color: #3390ec;
            --button-text-color: #ffffff;
            --secondary-bg-color: #f4f4f5;
            --destructive-text-color: #e53935;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #212121;
                --text-color: #ffffff;
                --hint-color: #aaaaaa;
                --button-color: #8774e1;
                --button-text-color: #ffffff;
                --secondary-bg-color: #0f0f0f;
                --destructive-text-color: #ff595a;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none; 
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background-color: var(--hint-color); border-radius: 10px; }
        
        /* Smooth momentum scrolling for iOS */
        .tab-scroll-container {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .tab-scroll-container::-webkit-scrollbar {
            display: none;
        }
        
        .sortable-ghost { opacity: 0.4; }

        /* Custom dropdown arrow indicator */
        .custom-select-wrapper {
            position: relative;
        }
        .custom-select-wrapper::after {
            content: "";
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 0.55rem;
            height: 0.55rem;
            border-right: 2px solid var(--hint-color);
            border-bottom: 2px solid var(--hint-color);
            transform: translateY(-70%) rotate(45deg);
            pointer-events: none;
        }

        /* Smooth tab transition styling */
        #task-container {
            touch-action: pan-y;
            will-change: transform;
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
        }
        #task-container.swiping {
            transition: none !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4">

    <div class="max-w-md w-full mx-auto flex flex-col h-full gap-4">
        
        <!-- Header -->
        <header class="py-2 shrink-0">
            <h1 class="text-2xl font-bold">Start Tomorrow</h1>
            <p class="text-[var(--hint-color)] text-sm mt-1">Get shit done. Or don’t.</p>
        </header>

        <!-- Tabs Area (Drag & Drop Enabled) -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1 shrink-0 tab-scroll-container" id="tab-bar">
            <!-- Tabs injected via JS -->
        </div>

        <!-- Timer Bar (Only visible for timed lists) -->
        <div id="timer-container" class="hidden bg-[var(--secondary-bg-color)] px-3 py-3 rounded-2xl flex items-center justify-between shrink-0 shadow-sm border border-[var(--hint-color)] border-opacity-10 gap-2">
            <div class="flex items-center gap-1.5 min-w-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[var(--destructive-text-color)] animate-pulse shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="timer-display" class="text-base font-mono font-bold tracking-tight truncate">00:00:00</span>
            </div>
            <div class="flex items-center gap-1 shrink-0">
                <button id="timer-toggle-btn" class="bg-[var(--button-color)] text-[var(--button-text-color)] px-2.5 py-1.5 rounded-xl font-semibold text-xs active:scale-95 transition-transform shadow-sm">Start</button>
                <button id="timer-stop-btn" class="bg-[var(--hint-color)] bg-opacity-20 text-[var(--text-color)] px-2 py-1.5 rounded-xl font-semibold text-xs active:scale-95 transition-transform" title="Reset Timer">Reset</button>
                <button id="uncheck-all-btn" class="bg-[var(--destructive-text-color)] bg-opacity-15 text-[var(--button-text-color)] px-2 py-1.5 rounded-xl font-semibold text-xs active:scale-95 transition-transform" title="Uncheck all tasks">Uncheck</button>
            </div>
        </div>

        <!-- Input Area (Hidden for Planners) -->
        <div id="global-input-area" class="flex gap-2 w-full shrink-0 items-center">
            <input 
                type="text" 
                id="task-input" 
                placeholder="Add new..." 
                class="flex-1 bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all min-w-0"
            >
            <input 
                type="number" 
                id="task-time-input" 
                placeholder="Mins" 
                min="1" 
                max="300"
                inputmode="numeric"
                pattern="[0-9]*"
                class="w-20 bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-3 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all text-center font-medium shrink-0"
                title="Approximate time in minutes"
            >
            <!-- Pill Tracker Specific Inputs -->
            <input 
                type="text" 
                id="pill-dose-input" 
                placeholder="Dose" 
                class="hidden w-20 bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-3 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all text-center font-medium shrink-0"
                title="Dosage (e.g., 10mg, 1 pill)"
            >
            <div id="pill-time-wrapper" class="hidden custom-select-wrapper shrink-0">
                <select 
                    id="pill-time-select" 
                    class="bg-[var(--secondary-bg-color)] text-[var(--text-color)] rounded-xl pl-3 pr-8 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all text-sm font-medium border border-[var(--hint-color)] border-opacity-20 appearance-none cursor-pointer"
                >
                    <option value="morning">Morning</option>
                    <option value="day">Day</option>
                    <option value="night">Night</option>
                </select>
            </div>

            <button 
                id="add-btn" 
                class="bg-[var(--button-color)] text-[var(--button-text-color)] rounded-xl px-4 py-3 font-semibold shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>

        <!-- Swipable Checklist Container -->
        <div id="task-container" class="flex-1 overflow-y-auto mt-2">
            <ul id="task-list" class="flex flex-col gap-2 pb-20">
                <!-- Tasks injected via JS -->
            </ul>
        </div>
        
        <!-- Empty State Container -->
        <div id="empty-state" class="hidden flex-col items-center justify-center text-center mt-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-[var(--hint-color)] mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 022 2h2a2 2 0 022-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
            <p class="text-[var(--hint-color)]">Your tab is empty.<br>Add some items to get started!</p>
        </div>

    </div>

    <!-- New Tab Modal -->
    <div id="new-tab-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[var(--bg-color)] p-6 rounded-2xl w-full max-w-sm flex flex-col gap-4 shadow-xl border border-[var(--secondary-bg-color)]">
            <h2 class="text-xl font-bold">Create New Tab</h2>
            
            <div class="custom-select-wrapper w-full">
                <select 
                    id="new-tab-select" 
                    class="w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all appearance-none cursor-pointer pr-10 border border-[var(--hint-color)] border-opacity-20 font-medium"
                >
                    <!-- Options injected via JS -->
                </select>
            </div>

            <input 
                type="text" 
                id="new-tab-input" 
                placeholder="Enter tab name..." 
                class="hidden w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all"
            >

            <div class="flex gap-2 justify-end mt-2">
                <button id="cancel-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold text-[var(--hint-color)] hover:bg-[var(--secondary-bg-color)] transition-colors">Cancel</button>
                <button id="save-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold bg-[var(--button-color)] text-[var(--button-text-color)] shadow-sm active:scale-95 transition-transform">Create</button>
            </div>
        </div>
    </div>

    <!-- Manage Tab Modal (Rename / Delete) -->
    <div id="edit-tab-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[var(--bg-color)] p-6 rounded-2xl w-full max-w-sm flex flex-col gap-4 shadow-xl border border-[var(--secondary-bg-color)]">
            <h2 class="text-xl font-bold">Manage Tab</h2>
            <input 
                type="text" 
                id="edit-tab-input" 
                placeholder="Tab name..." 
                class="w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all"
            >
            <div class="flex gap-2 justify-between mt-2">
                <button id="delete-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold text-[var(--button-text-color)] bg-[var(--destructive-text-color)] bg-opacity-10 hover:bg-opacity-20 transition-colors">Delete</button>
                <div class="flex gap-2">
                    <button id="cancel-edit-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold text-[var(--hint-color)] hover:bg-[var(--secondary-bg-color)] transition-colors">Cancel</button>
                    <button id="save-edit-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold bg-[var(--button-color)] text-[var(--button-text-color)] shadow-sm active:scale-95 transition-transform">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Task Time / Dose Modal -->
    <div id="edit-time-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[var(--bg-color)] p-6 rounded-2xl w-full max-w-sm flex flex-col gap-4 shadow-xl border border-[var(--secondary-bg-color)]">
            <h2 id="edit-modal-title" class="text-xl font-bold">Edit Item Details</h2>
            <p id="edit-time-task-name" class="text-sm text-[var(--hint-color)] truncate"></p>
            <input 
                type="text" 
                id="edit-time-input" 
                placeholder="Value" 
                class="w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all font-medium text-center text-lg"
            >
            <div class="flex gap-2 justify-end mt-2">
                <button id="cancel-time-btn" class="px-5 py-2.5 rounded-xl font-semibold text-[var(--hint-color)] hover:bg-[var(--secondary-bg-color)] transition-colors">Cancel</button>
                <button id="save-time-btn" class="px-5 py-2.5 rounded-xl font-semibold bg-[var(--button-color)] text-[var(--button-text-color)] shadow-sm active:scale-95 transition-transform">Save</button>
            </div>
        </div>
    </div>

    <script>
        const defaultCleaningTasks = [
            { text: "Vacuuming the floors", time: 15 },
            { text: "Dusting the kitchen", time: 10 },
            { text: "Dishes", time: 10 },
            { text: "Kitchen surfaces", time: 10 },

        const defaultHousehold = [
            { text: "Gloves", status: 'in_stock' },

        ];

        const defaultDeepClean = [
            { text: "Vacuuming the floors", time: 15 },
            { text: "Washing the curtains", time: 20 },
            { text: "Washing the cat bed", time: 15 },
            { text: "Washing decorative textile", time: 15 },

            { text: "Under the sink cabinets", time: 15 },

            { text: "Toaster", time: 10 },
            { text: "Coffemaker area", time: 10 },
            { text: "Kitchen surfaces", time: 10 },
            { text: "Kitchen sink", time: 5 },
            { text: "Window boards", time: 10 },
            { text: "Table", time: 5 },
            { text: "Books", time: 15 },
            { text: "Flowers", time: 10 },
            { text: "Mirrors", time: 5 },
            { text: "Lamps", time: 5 },
            { text: "Change the bedsheets", time: 10 },
            { text: "Sofa", time: 10 },
            { text: "Ironing", time: 20 },
            { text: "Dusting the rooms", time: 15 },
            { text: "Baseboards", time: 15 },
            { text: "Baseboards behind the furniture", time: 20 },
            { text: "Toilet", time: 10 },
            { text: "Litterboxes", time: 5 },
            { text: "Washing machine", time: 10 },
            { text: "Shower", time: 15 },
            { text: "Vanity area", time: 5 },
            { text: "Bathroom sink", time: 5 },
            { text: "Vacuuming", time: 10 },
            { text: "Floors", time: 15 },
            { text: "Wash the towels & rugs", time: 10 },
            { text: "Wash the bedsheets", time: 5 },
            { text: "Trash", time: 5 }
        ];

        const defaultGroceries = [
            { text: "Fresh milk", status: 'in_stock' },
            { text: "Eggs", status: 'low' },
            { text: "Butter", status: 'in_stock' },
            { text: "Greek yogurt", status: 'in_stock' },
            { text: "Cheddar cheese", status: 'in_stock' },
            { text: "Sourdough bread", status: 'out_of_stock' },
            { text: "Olive oil", status: 'in_stock' },
            { text: "Coffee beans", status: 'low' },
            { text: "Bananas", status: 'out_of_stock' },
            { text: "Avocados", status: 'in_stock' },
            { text: "Apples", status: 'in_stock' },
            { text: "Spinach", status: 'low' },
            { text: "Tomatoes", status: 'in_stock' },
            { text: "Garlic & onions", status: 'in_stock' },
            { text: "Chicken breast", status: 'in_stock' },
            { text: "Salmon fillets", status: 'out_of_stock' },
            { text: "Rice", status: 'in_stock' },
            { text: "Pasta", status: 'in_stock' },
            { text: "Oatmeal", status: 'in_stock' },
            { text: "Sparkling water", status: 'low' }
        ];

        const defaultPills = [
            { text: "Multivitamin", dose: "1 pill", section: "morning", completed: false },
            { text: "Vitamin D3", dose: "2000 IU", section: "morning", completed: false },
            { text: "Omega 3", dose: "1000mg", section: "day", completed: false },
            { text: "Magnesium", dose: "400mg", section: "night", completed: false }
        ];

        let lists = [];
        let activeListId = 1;
        let nextListId = 4;
        let sortableTasksInstances = []; // Changed to array for planner multi-lists
        let sortableTabsInstance = null;

        // Global Timer State
        let timerTotalSeconds = 0;
        let timerSecondsRemaining = 0;
        let timerInterval = null;
        let isTimerRunning = false;

        // Planner Timers State
        let plannerTimers = {}; // e.g. { "1_morning": { elapsed: 0, isRunning: false, intervalId: null } }

        let editingTaskId = null;

        // Time-Window Checker for Pills
        function isPillOverdue(task) {
            if (task.completed) return false;
            
            const currentHour = new Date().getHours(); // 0 to 23
            const section = task.section || 'morning';

            // Morning window: 0:00 - 11:59 (overdue from 12:00 onwards)
            if (section === 'morning' && currentHour >= 12) return true;
            // Day window: 12:00 - 17:59 (overdue from 18:00 onwards)
            if (section === 'day' && currentHour >= 18) return true;
            
            return false;
        }

        function listHasOverduePills(list) {
            if (!list || list.type !== 'pill') return false;
            return list.tasks.some(task => isPillOverdue(task));
        }

        // Midnight Reset Tracker
        function checkAndResetPillTrackers() {
            const todayStr = new Date().toDateString();
            const lastResetDate = localStorage.getItem('cleanAppLastPillReset');

            if (lastResetDate !== todayStr) {
                lists.forEach(l => {
                    if (l.type === 'pill') {
                        l.tasks.forEach(t => t.completed = false);
                    }
                });
                localStorage.setItem('cleanAppLastPillReset', todayStr);
                saveData();
            }
        }

        // Periodically refresh UI to check time status automatically
        setInterval(() => {
            checkAndResetPillTrackers();
            const activeList = getActiveList();
            if (activeList && activeList.type === 'pill') {
                renderTasks();
            }
            renderTabs();
        }, 60000);

        // Load or initialize data
        const savedMultiData = localStorage.getItem('cleanChecklistMultiData');
        if (savedMultiData) {
            const parsed = JSON.parse(savedMultiData);
            lists = parsed.lists || [];
            
            lists.forEach(l => {
                if (!l.type) {
                    l.type = (l.name === 'Household' || l.name === 'Supplies' || l.name === 'Groceries') ? 'shopping' : 'timed';
                }
                if (l.name === 'Supplies') l.name = 'Household';
                
                l.tasks.forEach(t => {
                    if ((l.type === 'timed' || l.type === 'planner') && t.time === undefined) t.time = 5;
                    if (l.type === 'shopping' && !t.status) t.status = t.completed ? 'out_of_stock' : 'in_stock';
                    if (l.type === 'pill') {
                        if (!t.section) t.section = 'morning';
                        if (t.dose === undefined) t.dose = '1 pill';
                    }
                });
            });

            activeListId = parsed.activeListId || (lists.length > 0 ? lists[0].id : 1);
            nextListId = lists.length > 0 ? Math.max(...lists.map(l => l.id)) + 1 : 4;
        } else {
            // Default setup
            const cleaningTasks = defaultCleaningTasks.map((t, index) => ({ id: index + 1, text: t.text, time: t.time, completed: false }));
            const groceriesTasks = defaultGroceries.map((t, index) => ({ id: index + 1, text: t.text, status: t.status, completed: false }));
            const pillTasks = defaultPills.map((t, index) => ({ id: index + 1, text: t.text, dose: t.dose, section: t.section, completed: false }));

            lists = [
                { id: 1, name: 'Cleaning', type: 'timed', tasks: cleaningTasks, nextTaskId: cleaningTasks.length + 1 },
                { id: 2, name: 'Groceries', type: 'shopping', tasks: groceriesTasks, nextTaskId: groceriesTasks.length + 1 },
                { id: 3, name: 'Pills', type: 'pill', tasks: pillTasks, nextTaskId: pillTasks.length + 1 }
            ];
            activeListId = 1;
            saveData();
        }

        checkAndResetPillTrackers();

        function saveData() {
            localStorage.setItem('cleanChecklistMultiData', JSON.stringify({ lists: lists, activeListId: activeListId }));
        }

        const globalInputArea = document.getElementById('global-input-area');
        const taskInput = document.getElementById('task-input');
        const taskTimeInput = document.getElementById('task-time-input');
        const pillDoseInput = document.getElementById('pill-dose-input');
        const pillTimeWrapper = document.getElementById('pill-time-wrapper');
        const pillTimeSelect = document.getElementById('pill-time-select');
        const addBtn = document.getElementById('add-btn');
        const taskList = document.getElementById('task-list');
        const taskContainer = document.getElementById('task-container');
        const emptyState = document.getElementById('empty-state');
        const tabBar = document.getElementById('tab-bar');
        
        // Timer Elements
        const timerContainer = document.getElementById('timer-container');
        const timerDisplay = document.getElementById('timer-display');
        const timerToggleBtn = document.getElementById('timer-toggle-btn');
        const timerStopBtn = document.getElementById('timer-stop-btn');
        const uncheckAllBtn = document.getElementById('uncheck-all-btn');

        // Modals
        const newTabModal = document.getElementById('new-tab-modal');
        const newTabSelect = document.getElementById('new-tab-select');
        const newTabInput = document.getElementById('new-tab-input');
        
        const editTabModal = document.getElementById('edit-tab-modal');
        const editTabInput = document.getElementById('edit-tab-input');
        const deleteTabBtn = document.getElementById('delete-tab-btn');

        // Edit Time / Dose Modal Elements
        const editTimeModal = document.getElementById('edit-time-modal');
        const editModalTitle = document.getElementById('edit-modal-title');
        const editTimeTaskName = document.getElementById('edit-time-task-name');
        const editTimeInput = document.getElementById('edit-time-input');

        function getActiveList() { return lists.find(l => l.id === activeListId) || lists[0]; }

        function calculateTotalSeconds(list, section = null) {
            if (!list || (list.type !== 'timed' && list.type !== 'planner')) return 0;
            let activeUncompletedTasks = list.tasks.filter(t => !t.completed);
            if (section) {
                activeUncompletedTasks = activeUncompletedTasks.filter(t => t.section === section);
            }
            const totalMins = activeUncompletedTasks.reduce((sum, t) => sum + (Number(t.time) || 0), 0);
            return totalMins * 60;
        }

        function formatTime(totalSeconds) {
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function getPlannerTimer(listId, section) {
            const key = `${listId}_${section}`;
            if (!plannerTimers[key]) {
                plannerTimers[key] = { elapsed: 0, isRunning: false, intervalId: null };
            }
            return plannerTimers[key];
        }

        function stopAllTimers() {
            pauseTimer(); // Global timer
            Object.values(plannerTimers).forEach(timer => {
                if (timer.isRunning) {
                    timer.isRunning = false;
                    clearInterval(timer.intervalId);
                }
            });
        }

        function updateInputAreaState() {
            const activeList = getActiveList();
            
            // Hide all specialized inputs first
            taskTimeInput.classList.add('hidden');
            pillDoseInput.classList.add('hidden');
            pillTimeWrapper.classList.add('hidden');
            timerContainer.classList.add('hidden');
            timerContainer.classList.remove('flex');

            if (activeList.type === 'planner') {
                globalInputArea.classList.add('hidden');
                globalInputArea.classList.remove('flex');
                stopAllTimers();
            } else {
                globalInputArea.classList.remove('hidden');
                globalInputArea.classList.add('flex');

                if (activeList.type === 'timed') {
                    taskTimeInput.classList.remove('hidden');
                    timerContainer.classList.remove('hidden');
                    timerContainer.classList.add('flex');
                    taskInput.placeholder = "Add a timed task...";
                    timerTotalSeconds = calculateTotalSeconds(activeList);
                    if (!isTimerRunning) {
                        timerSecondsRemaining = timerTotalSeconds;
                    }
                    timerDisplay.textContent = formatTime(timerSecondsRemaining);
                } else if (activeList.type === 'pill') {
                    pillDoseInput.classList.remove('hidden');
                    pillTimeWrapper.classList.remove('hidden');
                    taskInput.placeholder = "Pill name...";
                    stopAllTimers();
                } else if (activeList.type === 'shopping') {
                    taskInput.placeholder = "Add item...";
                    stopAllTimers();
                } else {
                    taskInput.placeholder = "Add a task...";
                    stopAllTimers();
                }
            }
        }

        // --- GLOBAL TIMER FUNCTIONS ---
        function toggleTimer() {
            if (isTimerRunning) pauseTimer();
            else startTimer();
        }

        function startTimer() {
            if (timerSecondsRemaining <= 0) return;
            isTimerRunning = true;
            timerToggleBtn.textContent = 'Pause';
            timerToggleBtn.className = 'bg-[var(--destructive-text-color)] text-white px-2.5 py-1.5 rounded-xl font-semibold text-xs active:scale-95 transition-transform shadow-sm';
            
            timerInterval = setInterval(() => {
                if (timerSecondsRemaining > 0) {
                    timerSecondsRemaining--;
                    timerDisplay.textContent = formatTime(timerSecondsRemaining);
                    updateTaskVisualGradients();
                } else {
                    stopTimer();
                    alert('Time is up! Great job.');
                }
            }, 1000);
        }

        function pauseTimer() {
            isTimerRunning = false;
            clearInterval(timerInterval);
            timerToggleBtn.textContent = 'Start';
            timerToggleBtn.className = 'bg-[var(--button-color)] text-[var(--button-text-color)] px-2.5 py-1.5 rounded-xl font-semibold text-xs active:scale-95 transition-transform shadow-sm';
        }

        function stopTimer() {
            pauseTimer();
            const activeList = getActiveList();
            if (activeList.type === 'timed') {
                timerTotalSeconds = calculateTotalSeconds(activeList);
                timerSecondsRemaining = timerTotalSeconds;
                timerDisplay.textContent = formatTime(timerSecondsRemaining);
                updateTaskVisualGradients();
            }
        }

        // --- PLANNER TIMER FUNCTIONS ---
        function togglePlannerTimer(section) {
            const activeList = getActiveList();
            const timer = getPlannerTimer(activeList.id, section);
            
            if (timer.isRunning) {
                timer.isRunning = false;
                clearInterval(timer.intervalId);
                renderTasks(); 
            } else {
                const totalSecs = calculateTotalSeconds(activeList, section);
                if (totalSecs - timer.elapsed <= 0) return;
                
                timer.isRunning = true;
                timer.intervalId = setInterval(() => {
                    timer.elapsed++;
                    // Cap elapsed to total
                    const currentTotal = calculateTotalSeconds(activeList, section);
                    if (timer.elapsed > currentTotal) timer.elapsed = currentTotal;
                    
                    const remaining = Math.max(0, currentTotal - timer.elapsed);
                    const display = document.getElementById(`planner-timer-${section}`);
                    if (display) display.textContent = formatTime(remaining);
                    
                    updatePlannerVisualGradients(section);
                    
                    if (remaining <= 0) {
                        timer.isRunning = false;
                        clearInterval(timer.intervalId);
                        renderTasks();
                        alert(`Time's up for the ${section} block!`);
                    }
                }, 1000);
                renderTasks();
            }
        }

        function resetPlannerTimer(section) {
            const activeList = getActiveList();
            const timer = getPlannerTimer(activeList.id, section);
            timer.isRunning = false;
            clearInterval(timer.intervalId);
            timer.elapsed = 0;
            renderTasks();
        }

        function uncheckAllTasks() {
            const activeList = getActiveList();
            if (!activeList) return;
            
            activeList.tasks.forEach(t => {
                t.completed = false;
                if (activeList.type === 'shopping') {
                    t.status = 'in_stock';
                }
            });
            stopAllTimers();
            
            if (activeList.type === 'planner') {
                ['morning', 'afternoon', 'evening'].forEach(sec => {
                    const timer = getPlannerTimer(activeList.id, sec);
                    timer.elapsed = 0;
                });
            }

            saveData();
            renderTasks();
            renderTabs();
            updateInputAreaState();
        }

        function updateTaskVisualGradients() {
            const activeList = getActiveList();
            if (!activeList || activeList.type !== 'timed') return;

            const activeTotalSecs = calculateTotalSeconds(activeList);
            if (activeTotalSecs <= 0) return;

            const elapsedSecs = Math.max(0, activeTotalSecs - timerSecondsRemaining);
            let accumulatedSecs = 0;
            const liElements = taskList.querySelectorAll('li[data-id]');

            activeList.tasks.forEach((task) => {
                const li = Array.from(liElements).find(el => el.dataset.id == task.id);
                if (!li) return;

                if (task.completed) {
                    li.style.background = 'rgba(34, 197, 94, 0.2)';
                    li.style.borderColor = 'rgba(34, 197, 94, 0.4)';
                    return;
                }

                const taskDurationSecs = (Number(task.time) || 0) * 60;
                const taskStartSecs = accumulatedSecs;
                accumulatedSecs += taskDurationSecs;
                const taskEndSecs = accumulatedSecs;

                if (isTimerRunning && elapsedSecs >= taskStartSecs) {
                    const taskProgress = Math.min(1, Math.max(0, (elapsedSecs - taskStartSecs) / Math.max(1, (taskEndSecs - taskStartSecs))));
                    if (taskProgress > 0) {
                        li.style.background = `linear-gradient(to right, rgba(239, 68, 68, 0.45) ${taskProgress * 100}%, var(--secondary-bg-color) ${taskProgress * 100}%)`;
                    } else {
                        li.style.background = 'var(--secondary-bg-color)';
                    }
                } else {
                    li.style.background = 'var(--secondary-bg-color)';
                }
            });
        }

        function updatePlannerVisualGradients(section) {
            const activeList = getActiveList();
            if (!activeList || activeList.type !== 'planner') return;

            const timer = getPlannerTimer(activeList.id, section);
            const activeTotalSecs = calculateTotalSeconds(activeList, section);
            
            // Fix elapsed if it exceeds total
            if (timer.elapsed > activeTotalSecs) timer.elapsed = activeTotalSecs;

            const elapsedSecs = timer.elapsed;
            let accumulatedSecs = 0;
            
            const liElements = taskList.querySelectorAll(`ul[data-section="${section}"] li[data-id]`);
            const secTasks = activeList.tasks.filter(t => t.section === section);

            secTasks.forEach((task) => {
                const li = Array.from(liElements).find(el => el.dataset.id == task.id);
                if (!li) return;

                if (task.completed) {
                    li.style.background = 'rgba(34, 197, 94, 0.2)';
                    li.style.borderColor = 'rgba(34, 197, 94, 0.4)';
                    return;
                }

                const taskDurationSecs = (Number(task.time) || 0) * 60;
                const taskStartSecs = accumulatedSecs;
                accumulatedSecs += taskDurationSecs;
                const taskEndSecs = accumulatedSecs;

                if (timer.isRunning && elapsedSecs >= taskStartSecs) {
                    const taskProgress = Math.min(1, Math.max(0, (elapsedSecs - taskStartSecs) / Math.max(1, (taskEndSecs - taskStartSecs))));
                    if (taskProgress > 0) {
                        li.style.background = `linear-gradient(to right, rgba(239, 68, 68, 0.45) ${taskProgress * 100}%, var(--secondary-bg-color) ${taskProgress * 100}%)`;
                    } else {
                        li.style.background = 'var(--secondary-bg-color)';
                    }
                } else {
                    li.style.background = 'var(--secondary-bg-color)';
                }
            });
        }

        function renderTasks() {

                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            if (activeList) {
                if (activeList.type === 'pill') {
                    // RENDER PILL TRACKER SECTIONS
                    const sections = [
                        { key: 'morning', title: '☀️ Morning (up to 12 PM)' },
                        { key: 'day', title: '🌤️ Day (12 PM - 6 PM)' },
                        { key: 'night', title: '🌙 Night (6 PM - 12 AM)' }
                    ];

                    sections.forEach(sec => {
                        const secTasks = activeList.tasks.filter(t => (t.section || 'morning') === sec.key);
                        if (secTasks.length > 0) {
                            const header = document.createElement('div');
                            header.className = 'text-xs font-bold uppercase tracking-wider text-[var(--hint-color)] pt-3 pb-1 px-1';
                            header.textContent = sec.title;
                            taskList.appendChild(header);

                            secTasks.forEach(task => {
                                taskList.appendChild(createPillTaskElement(task));
                            });
                        }
                    });

                } else if (activeList.type === 'planner') {
                    // RENDER DAILY PLANNER BLOCKS
                    const blocks = [
                        { key: 'morning', title: 'Morning Block' },
                        { key: 'afternoon', title: 'Afternoon Block' },
                        { key: 'evening', title: 'Evening Block' }
                    ];

                    blocks.forEach(block => {
                        const timer = getPlannerTimer(activeList.id, block.key);
                        const totalSecs = calculateTotalSeconds(activeList, block.key);
                        // Fix elapsed bounds gracefully without throwing errors
                        if (timer.elapsed > totalSecs) timer.elapsed = totalSecs;
                        const remaining = Math.max(0, totalSecs - timer.elapsed);

                        const blockContainer = document.createElement('div');
                        blockContainer.className = 'mb-6 flex flex-col gap-2';
                        
                        // Header & Timer
                        const header = document.createElement('div');
                        header.className = 'flex justify-between items-center mb-1 px-1';
                        header.innerHTML = `
                            <h3 class="font-bold text-lg text-[var(--text-color)]">${block.title}</h3>
                            <div class="flex items-center gap-1.5 shrink-0 bg-[var(--secondary-bg-color)] px-2.5 py-1.5 rounded-xl border border-[var(--hint-color)] border-opacity-10 shadow-sm">
                                ${timer.isRunning ? `<svg class="h-3 w-3 text-[var(--destructive-text-color)] animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>` : ''}
                                <span id="planner-timer-${block.key}" class="font-mono font-bold text-sm tracking-tight">${formatTime(remaining)}</span>
                                <button onclick="togglePlannerTimer('${block.key}')" class="${timer.isRunning ? 'bg-[var(--destructive-text-color)] text-white' : 'bg-[var(--button-color)] text-[var(--button-text-color)]'} text-xs px-2 py-1 rounded-lg font-semibold active:scale-95 transition-transform ml-1">
                                    ${timer.isRunning ? 'Pause' : 'Start'}
                                </button>
                                <button onclick="resetPlannerTimer('${block.key}')" class="bg-[var(--hint-color)] bg-opacity-20 text-[var(--text-color)] text-xs px-2 py-1 rounded-lg font-semibold active:scale-95 transition-transform">Reset</button>
                            </div>
                        `;
                        blockContainer.appendChild(header);

                        // Dropzone for Sortable
                        const dropzone = document.createElement('ul');
                        dropzone.className = 'planner-dropzone flex flex-col gap-2 min-h-[10px] pb-1'; 
                        dropzone.dataset.section = block.key;
                        
                        const secTasks = activeList.tasks.filter(t => t.section === block.key);
                        secTasks.forEach(task => {
                            dropzone.appendChild(createStandardTaskElement(task, 'planner'));
                        });
                        blockContainer.appendChild(dropzone);

                        // Dedicated Input Block
                        const inputRow = document.createElement('div');
                        inputRow.className = 'flex gap-2 w-full mt-1 shrink-0 items-center';
                        inputRow.innerHTML = `
                            <input type="text" id="planner-input-${block.key}" placeholder="Add to ${block.title}..." class="flex-1 bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all min-w-0 text-sm">
                            <input type="number" id="planner-time-${block.key}" placeholder="Mins" class="w-16 bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-2 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all text-center font-medium shrink-0 text-sm">
                            <button onclick="addPlannerTask('${block.key}')" class="bg-[var(--button-color)] text-[var(--button-text-color)] rounded-xl px-3 py-3 font-semibold shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                            </button>
                        `;

                        // Attach enter key events directly to these dynamic inputs
                        setTimeout(() => {
                            const tIn = document.getElementById(`planner-input-${block.key}`);
                            const mIn = document.getElementById(`planner-time-${block.key}`);
                            if(tIn) tIn.addEventListener('keypress', e => { if (e.key === 'Enter') addPlannerTask(block.key); });
                            if(mIn) mIn.addEventListener('keypress', e => { if (e.key === 'Enter') addPlannerTask(block.key); });
                        }, 0);

                        blockContainer.appendChild(inputRow);
                        taskList.appendChild(blockContainer);
                    });

                    // Update visuals for all planners after rendering
                    blocks.forEach(block => updatePlannerVisualGradients(block.key));

                } else {
                    activeList.tasks.forEach(task => {
                        taskList.appendChild(createStandardTaskElement(task, activeList.type));
                    });
                    updateTaskVisualGradients();
                }
            }
            initSortableTasks();
        }

        function initSortableTasks() {
            // Clean up old instances (array for planners, single for others)
            if (sortableTasksInstances && sortableTasksInstances.length > 0) {
                sortableTasksInstances.forEach(inst => inst.destroy());
            }
            sortableTasksInstances = [];

            const activeList = getActiveList();
            if (!activeList) return;

            if (activeList.type === 'planner') {
                const dropzones = document.querySelectorAll('.planner-dropzone');
                dropzones.forEach(zone => {
                    const inst = new Sortable(zone, {
                        group: 'planner-tasks',
                        handle: '.drag-handle',
                        animation: 200,
                        delay: 100,
                        delayOnTouchOnly: true,
                        onEnd: function (evt) {
                            const itemEl = evt.item;
                            const taskId = parseInt(itemEl.dataset.id);
                            const newSection = evt.to.dataset.section;
                            
                            const task = activeList.tasks.find(t => t.id === taskId);
                            if (task) task.section = newSection; 
                            
                            // Re-sort to match DOM array across all zones
                            const allNodes = Array.from(document.querySelectorAll('.planner-dropzone li[data-id]'));
                            activeList.tasks.sort((a, b) => {
                                const aIndex = allNodes.findIndex(node => parseInt(node.dataset.id) === a.id);
                                const bIndex = allNodes.findIndex(node => parseInt(node.dataset.id) === b.id);
                                if (aIndex === -1) return 1; if (bIndex === -1) return -1;
                                return aIndex - bIndex;
                            });
                            
                            saveData();
                            renderTasks();
                        }
                    });
                    sortableTasksInstances.push(inst);
                });
            } else {
                const inst = new Sortable(taskList, {
                    handle: '.drag-handle',
                    animation: 200,
                    delay: 100,
                    delayOnTouchOnly: true,
                    onEnd: function (evt) {
                        const oldIndex = evt.oldIndex;
                        const newIndex = evt.newIndex;
                        if (oldIndex !== newIndex) {
                            const [movedTask] = activeList.tasks.splice(oldIndex, 1);
                            activeList.tasks.splice(newIndex, 0, movedTask);
                            saveData();
                            renderTasks();
                        }
                    }
                });
                sortableTasksInstances.push(inst);
            }
        }

        // Direct Drag & Drop for Tabs
        function initSortableTabs() {
            if (sortableTabsInstance) sortableTabsInstance.destroy();
            sortableTabsInstance = new Sortable(tabBar, {
                animation: 200,
                draggable: 'button:not(.add-tab-btn)', 
                filter: '.add-tab-btn',
                delay: 150,
                delayOnTouchOnly: true,
                onStart: function (evt) {
                    evt.item.dataset.dragging = "true";
                },
                onEnd: function (evt) {
                    setTimeout(() => {
                        evt.item.dataset.dragging = "false";
                    }, 50);

                    const oldIndex = evt.oldIndex;
                    const newIndex = evt.newIndex;
                    
                    if (oldIndex !== undefined && newIndex !== undefined && oldIndex !== newIndex) {
                        const [movedList] = lists.splice(oldIndex, 1);
                        lists.splice(newIndex, 0, movedList);
                        saveData();
                    }
                }
            });
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;
            
            const activeList = getActiveList();
            if (!activeList) return;

            let taskTime = 0;
            if (activeList.type === 'timed') {
                taskTime = Number(taskTimeInput.value) || 5; 
            }

            const newTask = { 
                id: activeList.nextTaskId++, 
                text: text, 
                time: taskTime, 
                completed: false,
                status: activeList.type === 'shopping' ? 'out_of_stock' : 'in_stock',
                dose: activeList.type === 'pill' ? (pillDoseInput.value.trim() || '1 pill') : '',
                section: activeList.type === 'pill' ? pillTimeSelect.value : ''
            };

            activeList.tasks.push(newTask);

            taskInput.value = ''; 
            taskTimeInput.value = '';
            pillDoseInput.value = '';
            saveData(); 
            renderTasks();
            renderTabs();
            updateInputAreaState();
            taskContainer.scrollTop = taskContainer.scrollHeight;
        }

        function addPlannerTask(section) {
            const activeList = getActiveList();
            if (!activeList || activeList.type !== 'planner') return;
            
            const textInput = document.getElementById(`planner-input-${section}`);
            const timeInput = document.getElementById(`planner-time-${section}`);
            
            const text = textInput.value.trim();
            if (text === '') return;
            const taskTime = Number(timeInput.value) || 5;

            activeList.tasks.push({
                id: activeList.nextTaskId++,
                text: text,
                time: taskTime,
                completed: false,
                section: section
            });

            textInput.value = '';
            timeInput.value = '';
            saveData();
            renderTasks();
            // Scroll to bottom of section isn't trivial since they are stacked, but re-render works gracefully.
        }

        function toggleTask(id) {
            const activeList = getActiveList();
            if (!activeList) return;
            const task = activeList.tasks.find(t => t.id === id);
            if (task) {
                if (activeList.type === 'shopping') {
                    const currentStatus = task.status || 'in_stock';
                    if (currentStatus === 'in_stock') {
                        task.status = 'low';
                    } else if (currentStatus === 'low') {
                        task.status = 'out_of_stock';
                    } else {
                        task.status = 'in_stock';
                    }
                } else {
                    task.completed = !task.completed;
                    if (activeList.type === 'timed') {
                        timerTotalSeconds = calculateTotalSeconds(activeList);
                        if (timerSecondsRemaining > timerTotalSeconds) {
                            timerSecondsRemaining = timerTotalSeconds;
                        }
                        timerDisplay.textContent = formatTime(timerSecondsRemaining);
                    }
                }

                saveData(); 
                renderTasks();
                renderTabs();
            }
        }

        function deleteTask(id) {
            const activeList = getActiveList();
            if (!activeList) return;
            activeList.tasks = activeList.tasks.filter(t => t.id !== id);
            saveData(); 
            renderTasks();
            renderTabs();
            updateInputAreaState();
        }

        function openEditTimeModal(taskId) {
            const activeList = getActiveList();
            const task = activeList.tasks.find(t => t.id === taskId);
            if (!task) return;

            editingTaskId = taskId;
            editTimeTaskName.textContent = task.text;

            if (activeList.type === 'pill') {
                editModalTitle.textContent = "Edit Pill Dose";
                editTimeInput.type = "text";
                editTimeInput.value = task.dose || "1 pill";
            } else {
                editModalTitle.textContent = "Edit Task Time (Mins)";
                editTimeInput.type = "number";
                editTimeInput.value = task.time || 5;
            }

            editTimeModal.classList.remove('hidden');
            setTimeout(() => {
                editTimeInput.focus();
                editTimeInput.select();
            }, 100);
        }

        function closeEditTimeModal() {
            editTimeModal.classList.add('hidden');
            editingTaskId = null;
        }

        function saveTaskTime() {
            if (editingTaskId === null) return;
            const activeList = getActiveList();
            const task = activeList.tasks.find(t => t.id === editingTaskId);
            if (task) {
                if (activeList.type === 'pill') {
                    task.dose = editTimeInput.value.trim() || '1 pill';
                } else {
                    const newTime = Number(editTimeInput.value);
                    task.time = isNaN(newTime) || newTime < 0 ? 0 : newTime;
                }
                saveData();
                renderTasks();
                renderTabs();
                updateInputAreaState();
            }
            closeEditTimeModal();
        }

        function openNewTabModal() {
            newTabSelect.innerHTML = '';
            
            // 1. New Lists Optgroup
            const newListsGroup = document.createElement('optgroup');
            newListsGroup.label = "── LISTS ──";

            const optTimed = document.createElement('option');
            optTimed.value = 'cat_timed';
            optTimed.textContent = 'Timed Task List';

            const optSimple = document.createElement('option');
            optSimple.value = 'cat_simple';
            optSimple.textContent = 'Simple Task List';

            const optShopping = document.createElement('option');
            optShopping.value = 'cat_shopping';
            optShopping.textContent = 'Shopping List';

            newListsGroup.appendChild(optTimed);
            newListsGroup.appendChild(optSimple);
            newListsGroup.appendChild(optShopping);
            newTabSelect.appendChild(newListsGroup);

            // 2. Planners Optgroup
            const plannersGroup = document.createElement('optgroup');
            plannersGroup.label = "── PLANNERS ──";
            
            const optPlanner = document.createElement('option');
            optPlanner.value = 'cat_planner';
            optPlanner.textContent = 'Daily Planner';
            
            plannersGroup.appendChild(optPlanner);
            newTabSelect.appendChild(plannersGroup);

            // 3. Trackers Optgroup
            const trackersGroup = document.createElement('optgroup');
            trackersGroup.label = "── TRACKERS ──";

            const optPill = document.createElement('option');
            optPill.value = 'cat_pill';
            optPill.textContent = 'Pill Tracker';
            trackersGroup.appendChild(optPill);
            newTabSelect.appendChild(trackersGroup);

            // 4. Presets Optgroup
            const presetsGroup = document.createElement('optgroup');
            presetsGroup.label = "── PRESETS ──";

            const hasCleaning = lists.some(l => l.name === 'Cleaning');
            const hasDeepClean = lists.some(l => l.name === 'Deep Clean');
            const hasGroceries = lists.some(l => l.name === 'Groceries');
            const hasHousehold = lists.some(l => l.name === 'Household');
            const hasPillPreset = lists.some(l => l.name === 'Pills Preset');

            if (!hasCleaning) {
                const opt = document.createElement('option');
                opt.value = 'Cleaning';
                opt.textContent = 'Clean Preset';
                presetsGroup.appendChild(opt);
            }
            if (!hasDeepClean) {
                const opt = document.createElement('option');
                opt.value = 'Deep Clean';
                opt.textContent = 'Deep Clean Preset';
                presetsGroup.appendChild(opt);
            }
            if (!hasGroceries) {
                const opt = document.createElement('option');
                opt.value = 'Groceries';
                opt.textContent = 'Groceries Preset';
                presetsGroup.appendChild(opt);
            }
            if (!hasHousehold) {
                const opt = document.createElement('option');
                opt.value = 'Household';
                opt.textContent = 'Household Preset';
                presetsGroup.appendChild(opt);
            }
            if (!hasPillPreset) {
                const opt = document.createElement('option');
                opt.value = 'Pills Preset';
                opt.textContent = 'Pill Tracker Preset';
                presetsGroup.appendChild(opt);
            }

            if (presetsGroup.children.length > 0) {
                newTabSelect.appendChild(presetsGroup);
            }

            handleNewTabSelectChange();
            newTabModal.classList.remove('hidden');
        }

        function handleNewTabSelectChange() {
            const val = newTabSelect.value;
            if (val.startsWith('cat_')) {
                newTabInput.classList.remove('hidden');
                newTabInput.value = '';
                setTimeout(() => newTabInput.focus(), 100);
            } else {
                newTabInput.classList.add('hidden');
            }
        }

        function closeNewTabModal() { 
            newTabModal.classList.add('hidden'); 
        }

        function createNewTab() {
            let name = '';
            let initialTasks = [];
            let listType = 'timed';
            const val = newTabSelect.value;

            if (val.startsWith('cat_')) {
                name = newTabInput.value.trim();
                if (name === '') return;

                if (val === 'cat_timed') {
                    listType = 'timed';
                } else if (val === 'cat_shopping') {
                    listType = 'shopping';
                } else if (val === 'cat_pill') {
                    listType = 'pill';
                    initialTasks = [];
                } else if (val === 'cat_planner') {
                    listType = 'planner';
                    initialTasks = [];
                } else {
                    listType = 'standard';
                }
            } else {
                name = val;
                if (name === 'Cleaning') {
                    initialTasks = defaultCleaningTasks.map((t, index) => ({ id: index + 1, text: t.text, time: t.time, completed: false }));
                    listType = 'timed';
                } else if (name === 'Deep Clean') {
                    initialTasks = defaultDeepClean.map((t, index) => ({ id: index + 1, text: t.text, time: t.time, completed: false }));
                    listType = 'timed';
                } else if (name === 'Groceries') {
                    initialTasks = defaultGroceries.map((t, index) => ({ id: index + 1, text: t.text, status: t.status, completed: false }));
                    listType = 'shopping';
                } else if (name === 'Household') {
                    initialTasks = defaultHousehold.map((t, index) => ({ id: index + 1, text: t.text, status: t.status, completed: false }));
                    listType = 'shopping';
                } else if (name === 'Pills Preset') {
                    initialTasks = defaultPills.map((t, index) => ({ id: index + 1, text: t.text, dose: t.dose, section: t.section, completed: false }));
                    listType = 'pill';
                }
            }

            const nextTId = initialTasks.length > 0 ? Math.max(...initialTasks.map(t => t.id)) + 1 : 1;
            const newList = { id: nextListId++, name: name, type: listType, tasks: initialTasks, nextTaskId: nextTId };
            
            lists.push(newList);
            activeListId = newList.id;
            saveData();
            closeNewTabModal();
            renderTabs();
            renderTasks();
            updateInputAreaState();
        }

        function openEditTabModal() {
            const activeList = getActiveList();
            editTabInput.value = activeList.name;
            deleteTabBtn.style.display = lists.length <= 1 ? 'none' : 'block';
            editTabModal.classList.remove('hidden');
            deleteTabBtn.textContent = `Delete`;
            setTimeout(() => editTabInput.focus(), 100);
        }
        function closeEditTabModal() { editTabModal.classList.add('hidden'); }
        function saveEditTab() {
            const newName = editTabInput.value.trim();
            if (newName === '') return;
            const activeList = getActiveList();
            activeList.name = newName;
            saveData();
            closeEditTabModal();
            renderTabs();
        }
        function deleteCurrentTab() {
            if (lists.length <= 1) return;
            lists = lists.filter(l => l.id !== activeListId);
            activeListId = lists[0].id;
            saveData();
            closeEditTabModal();
            renderTabs();
            renderTasks();
            updateInputAreaState();
        }

        // SWIPE GESTURE CONTROLLER FOR TABS
        let touchStartX = 0;
        let touchStartY = 0;
        let touchCurrentX = 0;
        let touchCurrentY = 0;
        let isSwiping = false;

        taskContainer.addEventListener('touchstart', (e) => {
            if (e.target.closest('.drag-handle') || e.target.closest('button') || e.target.closest('input')) {
                isSwiping = false;
                return;
            }
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchCurrentX = touchStartX;
            touchCurrentY = touchStartY;
            isSwiping = true;
            taskContainer.classList.add('swiping');
        }, { passive: true });

        taskContainer.addEventListener('touchmove', (e) => {
            if (!isSwiping) return;
            touchCurrentX = e.touches[0].clientX;
            touchCurrentY = e.touches[0].clientY;

            const diffX = touchCurrentX - touchStartX;
            const diffY = touchCurrentY - touchStartY;

            if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 10) {
                isSwiping = false;
                taskContainer.style.transform = '';
                taskContainer.style.opacity = '';
                taskContainer.classList.remove('swiping');
                return;
            }

            if (Math.abs(diffX) > 10) {
                taskContainer.style.transform = `translateX(${diffX * 0.4}px)`;
                taskContainer.style.opacity = `${1 - Math.abs(diffX) / 600}`;
            }
        }, { passive: true });

        taskContainer.addEventListener('touchend', () => {
            if (!isSwiping) return;
            isSwiping = false;
            taskContainer.classList.remove('swiping');

            const diffX = touchCurrentX - touchStartX;
            const threshold = 60;

            if (diffX < -threshold) {
                const currentIndex = lists.findIndex(l => l.id === activeListId);
                if (currentIndex < lists.length - 1) {
                    switchTab(lists[currentIndex + 1].id);
                } else {
                    openNewTabModal();
                }
            } else if (diffX > threshold) {
                const currentIndex = lists.findIndex(l => l.id === activeListId);
                if (currentIndex > 0) {
                    switchTab(lists[currentIndex - 1].id);
                }
            }

            taskContainer.style.transform = '';
            taskContainer.style.opacity = '';
        });

        // Event Listeners
        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });
        taskTimeInput.addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });
        pillDoseInput.addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });
        
        timerToggleBtn.addEventListener('click', toggleTimer);
        timerStopBtn.addEventListener('click', stopTimer);
        uncheckAllBtn.addEventListener('click', uncheckAllTasks);

        document.getElementById('cancel-tab-btn').addEventListener('click', closeNewTabModal);
        document.getElementById('save-tab-btn').addEventListener('click', createNewTab);
        newTabSelect.addEventListener('change', handleNewTabSelectChange);
        newTabInput.addEventListener('keypress', e => { if (e.key === 'Enter') createNewTab(); });

        document.getElementById('cancel-edit-tab-btn').addEventListener('click', closeEditTabModal);
        document.getElementById('save-edit-tab-btn').addEventListener('click', saveEditTab);
        deleteTabBtn.addEventListener('click', deleteCurrentTab);
        editTabInput.addEventListener('keypress', e => { if (e.key === 'Enter') saveEditTab(); });

        // Edit Time / Dose Modal Listeners
        document.getElementById('cancel-time-btn').addEventListener('click', closeEditTimeModal);
        document.getElementById('save-time-btn').addEventListener('click', saveTaskTime);
        editTimeInput.addEventListener('keypress', e => { if (e.key === 'Enter') saveTaskTime(); });

        // Initial render
        renderTabs();
        renderTasks();
        initSortableTasks();
        updateInputAreaState();

    </script>
</body>
</html>
