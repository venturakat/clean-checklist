<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Clean Checklist</title>
    
    <!-- PWA / Home Screen Support -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SortableJS for mobile-friendly drag and drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --hint-color: #999999;
            --button-color: #3390ec;
            --button-text-color: #ffffff;
            --secondary-bg-color: #f4f4f5;
            --destructive-text-color: #e53935;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #212121;
                --text-color: #ffffff;
                --hint-color: #aaaaaa;
                --button-color: #8774e1;
                --button-text-color: #ffffff;
                --secondary-bg-color: #0f0f0f;
                --destructive-text-color: #ff595a;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none; 
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background-color: var(--hint-color); border-radius: 10px; }
        
        /* Smooth momentum scrolling for iOS */
        .tab-scroll-container {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .tab-scroll-container::-webkit-scrollbar {
            display: none;
        }
        
        .sortable-ghost { opacity: 0.4; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4">

    <div class="max-w-md w-full mx-auto flex flex-col h-full gap-4">
        
        <!-- Header -->
        <header class="py-2 shrink-0">
            <h1 class="text-2xl font-bold">Clean Checklist</h1>
            <p class="text-[var(--hint-color)] text-sm mt-1">Stay productive today.</p>
        </header>

        <!-- Tabs Area -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1 shrink-0 tab-scroll-container" id="tab-bar">
            <!-- Tabs injected via JS -->
        </div>

        <!-- Timer Bar (Only visible for timed lists) -->
        <div id="timer-container" class="hidden bg-[var(--secondary-bg-color)] px-4 py-3 rounded-2xl flex items-center justify-between shrink-0 shadow-sm border border-[var(--hint-color)] border-opacity-10">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[var(--destructive-text-color)] animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="timer-display" class="text-xl font-mono font-bold tracking-wider">03:30:00</span>
            </div>
            <div class="flex items-center gap-1.5">
                <button id="timer-toggle-btn" class="bg-[var(--button-color)] text-[var(--button-text-color)] px-3.5 py-1.5 rounded-xl font-semibold text-sm active:scale-95 transition-transform shadow-sm">Start</button>
                <button id="timer-stop-btn" class="bg-[var(--hint-color)] bg-opacity-20 text-[var(--text-color)] px-3 py-1.5 rounded-xl font-semibold text-sm active:scale-95 transition-transform">Reset</button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="flex gap-2 w-full shrink-0">
            <input 
                type="text" 
                id="task-input" 
                placeholder="Add a new task..." 
                class="flex-1 bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all"
            >
            <input 
                type="number" 
                id="task-time-input" 
                placeholder="Mins" 
                min="1" 
                max="300"
                inputmode="numeric"
                pattern="[0-9]*"
                class="w-20 bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-3 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all text-center font-medium"
                title="Approximate time in minutes"
            >
            <button 
                id="add-btn" 
                class="bg-[var(--button-color)] text-[var(--button-text-color)] rounded-xl px-4 py-3 font-semibold shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>

        <!-- Checklist Area -->
        <div class="flex-1 overflow-y-auto mt-2">
            <ul id="task-list" class="flex flex-col gap-2 pb-20">
                <!-- Tasks injected via JS -->
            </ul>
        </div>
        
        <!-- Empty State Container -->
        <div id="empty-state" class="hidden flex-col items-center justify-center text-center mt-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-[var(--hint-color)] mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
            <p class="text-[var(--hint-color)]">Your checklist is empty.<br>Add some tasks to get started!</p>
        </div>

    </div>

    <!-- New Tab Modal -->
    <div id="new-tab-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[var(--bg-color)] p-6 rounded-2xl w-full max-w-sm flex flex-col gap-4 shadow-xl border border-[var(--secondary-bg-color)]">
            <h2 class="text-xl font-bold">Create New List</h2>
            
            <select 
                id="new-tab-select" 
                class="w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all">
                <!-- Options injected via JS -->
            </select>

            <input 
                type="text" 
                id="new-tab-input" 
                placeholder="Enter custom list name..." 
                class="hidden w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all"
            >

            <div class="flex gap-2 justify-end mt-2">
                <button id="cancel-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold text-[var(--hint-color)] hover:bg-[var(--secondary-bg-color)] transition-colors">Cancel</button>
                <button id="save-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold bg-[var(--button-color)] text-[var(--button-text-color)] shadow-sm active:scale-95 transition-transform">Create</button>
            </div>
        </div>
    </div>

    <!-- Manage Tab Modal (Rename / Delete) -->
    <div id="edit-tab-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[var(--bg-color)] p-6 rounded-2xl w-full max-w-sm flex flex-col gap-4 shadow-xl border border-[var(--secondary-bg-color)]">
            <h2 class="text-xl font-bold">Manage List</h2>
            <input 
                type="text" 
                id="edit-tab-input" 
                placeholder="List name..." 
                class="w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all"
            >
            <div class="flex gap-2 justify-between mt-2">
                <button id="delete-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold text-[var(--button-text-color)] bg-[var(--destructive-text-color)] bg-opacity-10 hover:bg-opacity-20 transition-colors">Delete</button>
                <div class="flex gap-2">
                    <button id="cancel-edit-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold text-[var(--hint-color)] hover:bg-[var(--secondary-bg-color)] transition-colors">Cancel</button>
                    <button id="save-edit-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold bg-[var(--button-color)] text-[var(--button-text-color)] shadow-sm active:scale-95 transition-transform">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Task Time Modal -->
    <div id="edit-time-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[var(--bg-color)] p-6 rounded-2xl w-full max-w-sm flex flex-col gap-4 shadow-xl border border-[var(--secondary-bg-color)]">
            <h2 class="text-xl font-bold">Edit Task Time</h2>
            <p id="edit-time-task-name" class="text-sm text-[var(--hint-color)] truncate"></p>
            <input 
                type="number" 
                id="edit-time-input" 
                placeholder="Minutes" 
                min="1" 
                max="300"
                inputmode="numeric"
                pattern="[0-9]*"
                class="w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all font-medium text-center text-lg"
            >
            <div class="flex gap-2 justify-end mt-2">
                <button id="cancel-time-btn" class="px-5 py-2.5 rounded-xl font-semibold text-[var(--hint-color)] hover:bg-[var(--secondary-bg-color)] transition-colors">Cancel</button>
                <button id="save-time-btn" class="px-5 py-2.5 rounded-xl font-semibold bg-[var(--button-color)] text-[var(--button-text-color)] shadow-sm active:scale-95 transition-transform">Save</button>
            </div>
        </div>
    </div>

    <script>
        const defaultCleaningTasks = [
            { text: "Vacuuming the floors", time: 15 },
            { text: "Dusting the kitchen", time: 10 },
            { text: "Dishes", time: 10 },
            { text: "Kitchen surfaces", time: 10 },
            { text: "Kitchen sink", time: 5 },
            { text: "Window boards", time: 10 },
            { text: "Table", time: 5 },
            { text: "Mirrors", time: 5 },
            { text: "Lamps", time: 5 },
            { text: "Change the bedsheets", time: 10 },
            { text: "Sofa", time: 5 },
            { text: "Ironing", time: 20 },
            { text: "Dusting the rooms", time: 15 },
            { text: "Baseboards", time: 10 },
            { text: "Toilet", time: 10 },
            { text: "Litterboxes", time: 5 },
            { text: "Shower", time: 15 },
            { text: "Vanity area", time: 5 },
            { text: "Bathroom sink", time: 5 },
            { text: "Vacuuming", time: 5 },
            { text: "Floors", time: 10 },
            { text: "Wash the towels & rugs", time: 10 },
            { text: "Wash the bedsheets", time: 5 },
            { text: "Trash", time: 5 }
        ];
        
        const defaultSupplies = [
            { text: "Gloves", time: 0 },
            { text: "Sponges", time: 0 },
            { text: "Toilet paper", time: 0 },
            { text: "Domestos", time: 0 },
            { text: "Cilit", time: 0 },
            { text: "Barkeeper's friend", time: 0 },
            { text: "Pronto spray", time: 0 },
            { text: "Floor soap", time: 0 }
        ];

        const defaultDeepClean = [
            { text: "Vacuuming the floors", time: 15 },
            { text: "Washing the curtains", time: 20 },
            { text: "Washing the cat bed", time: 15 },
            { text: "Washing decorative textile", time: 15 },
            { text: "Dusting the kitchen", time: 10 },
            { text: "Dishes", time: 10 },
            { text: "Wine glasses", time: 10 },
            { text: "Kitchen cabinets", time: 20 },
            { text: "Under the sink cabinets", time: 15 },
            { text: "Fridge", time: 30 },
            { text: "Airfryer", time: 15 },
            { text: "Toaster", time: 10 },
            { text: "Coffemaker area", time: 10 },
            { text: "Kitchen surfaces", time: 10 },
            { text: "Kitchen sink", time: 5 },
            { text: "Window boards", time: 10 },
            { text: "Table", time: 5 },
            { text: "Books", time: 15 },
            { text: "Flowers", time: 10 },
            { text: "Mirrors", time: 5 },
            { text: "Lamps", time: 5 },
            { text: "Change the bedsheets", time: 10 },
            { text: "Sofa", time: 10 },
            { text: "Ironing", time: 20 },
            { text: "Dusting the rooms", time: 15 },
            { text: "Baseboards", time: 15 },
            { text: "Baseboards behind the furniture", time: 20 },
            { text: "Toilet", time: 10 },
            { text: "Litterboxes", time: 5 },
            { text: "Washing machine", time: 10 },
            { text: "Shower", time: 15 },
            { text: "Vanity area", time: 5 },
            { text: "Bathroom sink", time: 5 },
            { text: "Vacuuming", time: 10 },
            { text: "Floors", time: 15 },
            { text: "Wash the towels & rugs", time: 10 },
            { text: "Wash the bedsheets", time: 5 },
            { text: "Trash", time: 5 }
        ];

        let lists = [];
        let activeListId = 1;
        let nextListId = 4;
        let sortableTasksInstance = null;
        let sortableTabsInstance = null;

        // Timer State
        let timerTotalSeconds = 0;
        let timerSecondsRemaining = 0;
        let timerInterval = null;
        let isTimerRunning = false;

        let editingTaskId = null;

        // Load or initialize data
        const savedMultiData = localStorage.getItem('cleanChecklistMultiData');
        if (savedMultiData) {
            const parsed = JSON.parse(savedMultiData);
            lists = parsed.lists || [];
            
            lists.forEach(l => {
                if (!l.type) {
                    l.type = l.name === 'Supplies' ? 'standard' : 'timed';
                }
                l.tasks.forEach(t => {
                    if (t.time === undefined) t.time = l.type === 'timed' ? 5 : 0;
                });
            });

            activeListId = parsed.activeListId || (lists.length > 0 ? lists[0].id : 1);
            nextListId = lists.length > 0 ? Math.max(...lists.map(l => l.id)) + 1 : 4;
        } else {
            const cleaningTasks = defaultCleaningTasks.map((t, index) => ({ id: index + 1, text: t.text, time: t.time, completed: false }));
            const suppliesTasks = defaultSupplies.map((t, index) => ({ id: index + 1, text: t.text, time: t.time, completed: false }));
            const deepCleanTasks = defaultDeepClean.map((t, index) => ({ id: index + 1, text: t.text, time: t.time, completed: false }));

            lists = [
                { id: 1, name: 'Cleaning', type: 'timed', tasks: cleaningTasks, nextTaskId: cleaningTasks.length + 1 },
                { id: 2, name: 'Supplies', type: 'standard', tasks: suppliesTasks, nextTaskId: suppliesTasks.length + 1 },
                { id: 3, name: 'Deep Clean', type: 'timed', tasks: deepCleanTasks, nextTaskId: deepCleanTasks.length + 1 }
            ];
            activeListId = 1;
            saveData();
        }

        function saveData() {
            localStorage.setItem('cleanChecklistMultiData', JSON.stringify({ lists: lists, activeListId: activeListId }));
        }

        const taskInput = document.getElementById('task-input');
        const taskTimeInput = document.getElementById('task-time-input');
        const addBtn = document.getElementById('add-btn');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');
        const tabBar = document.getElementById('tab-bar');
        
        // Timer Elements
        const timerContainer = document.getElementById('timer-container');
        const timerDisplay = document.getElementById('timer-display');
        const timerToggleBtn = document.getElementById('timer-toggle-btn');
        const timerStopBtn = document.getElementById('timer-stop-btn');

        // Modals
        const newTabModal = document.getElementById('new-tab-modal');
        const newTabSelect = document.getElementById('new-tab-select');
        const newTabInput = document.getElementById('new-tab-input');
        
        const editTabModal = document.getElementById('edit-tab-modal');
        const editTabInput = document.getElementById('edit-tab-input');
        const deleteTabBtn = document.getElementById('delete-tab-btn');

        // Edit Time Modal Elements
        const editTimeModal = document.getElementById('edit-time-modal');
        const editTimeTaskName = document.getElementById('edit-time-task-name');
        const editTimeInput = document.getElementById('edit-time-input');

        function getActiveList() { return lists.find(l => l.id === activeListId) || lists[0]; }

        function calculateTotalSeconds(list) {
            if (!list || list.type !== 'timed') return 0;
            const totalMins = list.tasks.reduce((sum, t) => sum + (Number(t.time) || 0), 0);
            return totalMins * 60;
        }

        function formatTime(totalSeconds) {
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateInputAreaState() {
            const activeList = getActiveList();
            if (activeList.type === 'timed') {
                taskTimeInput.classList.remove('hidden');
                timerContainer.classList.remove('hidden');
                timerContainer.classList.add('flex');
                timerTotalSeconds = calculateTotalSeconds(activeList);
                if (!isTimerRunning) {
                    timerSecondsRemaining = timerTotalSeconds;
                }
                timerDisplay.textContent = formatTime(timerSecondsRemaining);
            } else {
                taskTimeInput.classList.add('hidden');
                timerContainer.classList.remove('flex');
                timerContainer.classList.add('hidden');
                stopTimer();
            }
        }

        function toggleTimer() {
            if (isTimerRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (timerSecondsRemaining <= 0) return;
            isTimerRunning = true;
            timerToggleBtn.textContent = 'Pause';
            timerToggleBtn.className = 'bg-[var(--destructive-text-color)] text-white px-3.5 py-1.5 rounded-xl font-semibold text-sm active:scale-95 transition-transform shadow-sm';
            
            timerInterval = setInterval(() => {
                if (timerSecondsRemaining > 0) {
                    timerSecondsRemaining--;
                    timerDisplay.textContent = formatTime(timerSecondsRemaining);
                    updateTaskVisualGradients();
                } else {
                    stopTimer();
                    alert('Time is up! Great job cleaning.');
                }
            }, 1000);
        }

        function pauseTimer() {
            isTimerRunning = false;
            clearInterval(timerInterval);
            timerToggleBtn.textContent = 'Start';
            timerToggleBtn.className = 'bg-[var(--button-color)] text-[var(--button-text-color)] px-3.5 py-1.5 rounded-xl font-semibold text-sm active:scale-95 transition-transform shadow-sm';
        }

        function stopTimer() {
            pauseTimer();
            const activeList = getActiveList();
            if (activeList.type === 'timed') {
                timerTotalSeconds = calculateTotalSeconds(activeList);
                timerSecondsRemaining = timerTotalSeconds;
                timerDisplay.textContent = formatTime(timerSecondsRemaining);
                updateTaskVisualGradients();
            }
        }

        // Calculates and applies dynamic red-to-green gradient shading on task rows
        function updateTaskVisualGradients() {
            const activeList = getActiveList();
            if (!activeList || activeList.type !== 'timed' || timerTotalSeconds <= 0) return;

            // Elapsed time ratio from 0 to 1
            const elapsedRatio = Math.max(0, Math.min(1, (timerTotalSeconds - timerSecondsRemaining) / timerTotalSeconds));
            
            // Cumulative time elapsed marker as we iterate down tasks from top to bottom
            let accumulatedTime = 0;
            const liElements = taskList.querySelectorAll('li');

            activeList.tasks.forEach((task, index) => {
                const li = liElements[index];
                if (!li) return;

                if (task.completed) {
                    // Green when checked off
                    li.style.background = 'rgba(34, 197, 94, 0.15)'; // soft green tint
                    li.style.borderColor = 'rgba(34, 197, 94, 0.4)';
                    return;
                }

                const taskDuration = Number(task.time) || 0;
                const taskStartRatio = accumulatedTime / (timerTotalSeconds / 60); // convert total back to minutes comparison
                accumulatedTime += taskDuration;
                const taskEndRatio = accumulatedTime / (timerTotalSeconds / 60);

                if (isTimerRunning && elapsedRatio >= taskStartRatio) {
                    // Calculate how much of this specific task's duration has passed (0 to 1)
                    const taskProgress = Math.min(1, Math.max(0, (elapsedRatio - taskStartRatio) / Math.max(0.0001, (taskEndRatio - taskStartRatio))));
                    
                    if (taskProgress > 0) {
                        // Gradual red fill from left to right using background-image linear-gradient
                        const redAlpha = 0.18 * taskProgress;
                        li.style.background = `linear-gradient(to right, rgba(239, 68, 68, ${redAlpha}) ${taskProgress * 100}%, var(--secondary-bg-color) ${taskProgress * 100}%)`;
                    } else {
                        li.style.background = 'var(--secondary-bg-color)';
                    }
                } else {
                    li.style.background = 'var(--secondary-bg-color)';
                }
            });
        }

        function renderTabs() {
            tabBar.innerHTML = '';
            
            lists.forEach(list => {
                const isActive = list.id === activeListId;
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-5 py-2 rounded-full text-sm font-semibold transition-all active:scale-95 shrink-0 shadow-sm flex items-center gap-1.5 cursor-grab active:cursor-grabbing ${
                    isActive 
                        ? 'bg-[var(--button-color)] text-[var(--button-text-color)]' 
                        : 'bg-[var(--secondary-bg-color)] text-[var(--text-color)] opacity-80 hover:opacity-100 border border-[var(--hint-color)] border-opacity-20'
                }`;
                btn.dataset.id = list.id;
                
                btn.innerHTML = isActive 
                    ? `<span>${list.name}</span> <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 opacity-70" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>` 
                    : list.name;
                
                btn.onclick = () => {
                    if (btn.dataset.dragging === "true") return;
                    if (isActive) {
                        openEditTabModal();
                    } else {
                        activeListId = list.id;
                        saveData();
                        renderTabs();
                        renderTasks();
                        updateInputAreaState();
                    }
                };
                tabBar.appendChild(btn);
            });

            const addTabBtn = document.createElement('button');
            addTabBtn.className = 'flex items-center justify-center w-9 h-9 ml-1 rounded-full bg-[var(--secondary-bg-color)] text-[var(--button-color)] shrink-0 active:scale-95 transition-transform border border-[var(--hint-color)] border-opacity-20';
            addTabBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>`;
            addTabBtn.onclick = openNewTabModal;
            tabBar.appendChild(addTabBtn);

            initSortableTabs();
        }

        function renderTasks() {
            taskList.innerHTML = ''; 
            const activeList = getActiveList();
            
            if (!activeList || activeList.tasks.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            if (activeList) {
                activeList.tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `flex items-center justify-between p-3 rounded-xl bg-[var(--secondary-bg-color)] transition-all duration-200 group ${task.completed ? 'opacity-75' : ''}`;
                    li.dataset.id = task.id;
                    
                    const leftDiv = document.createElement('div');
                    leftDiv.className = 'flex items-center gap-2 flex-1 min-w-0';

                    // Drag Handle
                    const dragHandle = document.createElement('div');
                    dragHandle.className = 'drag-handle py-2 pr-2 -ml-1 text-[var(--hint-color)] opacity-40 hover:opacity-100 cursor-grab active:cursor-grabbing touch-none shrink-0';
                    dragHandle.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" /></svg>`;
                    
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'flex items-center gap-3 flex-1 cursor-pointer min-w-0';
                    contentDiv.onclick = () => toggleTask(task.id);

                    const checkbox = document.createElement('div');
                    checkbox.className = `w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center transition-colors duration-200 ${
                        task.completed ? 'border-green-500 bg-green-500 text-white' : 'border-[var(--hint-color)] text-transparent'
                    }`;
                    checkbox.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>`;

                    const span = document.createElement('span');
                    span.className = `text-[var(--text-color)] text-base select-none truncate transition-all duration-200 ${task.completed ? 'line-through text-[var(--hint-color)]' : ''}`;
                    span.innerText = task.text;

                    contentDiv.appendChild(checkbox);
                    contentDiv.appendChild(span);
                    leftDiv.appendChild(dragHandle);
                    leftDiv.appendChild(contentDiv);

                    const rightSideDiv = document.createElement('div');
                    rightSideDiv.className = 'flex items-center gap-3 shrink-0 ml-2';

                    if (activeList.type === 'timed' && task.time > 0) {
                        const timeSpan = document.createElement('span');
                        timeSpan.className = 'text-[var(--destructive-text-color)] text-sm font-bold cursor-pointer hover:underline py-1 px-1.5 rounded hover:bg-[var(--destructive-text-color)] hover:bg-opacity-10 transition-colors';
                        timeSpan.innerText = `${task.time}m`;
                        timeSpan.title = "Tap to edit time";
                        timeSpan.onclick = (e) => {
                            e.stopPropagation();
                            openEditTimeModal(task.id);
                        };
                        rightSideDiv.appendChild(timeSpan);
                    }

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'p-2 text-[var(--hint-color)] hover:text-[var(--destructive-text-color)] active:scale-90 transition-all rounded-lg';
                    deleteBtn.onclick = (e) => { e.stopPropagation(); deleteTask(task.id); };
                    deleteBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>`;
                    
                    rightSideDiv.appendChild(deleteBtn);

                    li.appendChild(leftDiv);
                    li.appendChild(rightSideDiv);
                    taskList.appendChild(li);
                });
            }

            updateTaskVisualGradients();
        }

        function initSortableTasks() {
            if (sortableTasksInstance) sortableTasksInstance.destroy();
            sortableTasksInstance = new Sortable(taskList, {
                handle: '.drag-handle',
                animation: 200,
                delay: 100,
                delayOnTouchOnly: true,
                onEnd: function (evt) {
                    const activeList = getActiveList();
                    if (!activeList) return;
                    
                    const oldIndex = evt.oldIndex;
                    const newIndex = evt.newIndex;
                    
                    if (oldIndex !== newIndex) {
                        const [movedTask] = activeList.tasks.splice(oldIndex, 1);
                        activeList.tasks.splice(newIndex, 0, movedTask);
                        saveData();
                        renderTasks();
                    }
                }
            });
        }

        function initSortableTabs() {
            if (sortableTabsInstance) sortableTabsInstance.destroy();
            sortableTabsInstance = new Sortable(tabBar, {
                animation: 200,
                draggable: 'button:not(:last-child)', 
                filter: '.add-tab-btn',
                delay: 150,
                delayOnTouchOnly: true,
                onStart: function (evt) {
                    evt.item.dataset.dragging = "true";
                },
                onEnd: function (evt) {
                    setTimeout(() => {
                        evt.item.dataset.dragging = "false";
                    }, 50);

                    const oldIndex = evt.oldIndex;
                    const newIndex = evt.newIndex;
                    
                    if (oldIndex !== undefined && newIndex !== undefined && oldIndex !== newIndex) {
                        const [movedList] = lists.splice(oldIndex, 1);
                        lists.splice(newIndex, 0, movedList);
                        saveData();
                    }
                }
            });
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;
            
            const activeList = getActiveList();
            if (!activeList) return;

            let taskTime = 0;
            if (activeList.type === 'timed') {
                taskTime = Number(taskTimeInput.value) || 5; 
            }

            activeList.tasks.push({ 
                id: activeList.nextTaskId++, 
                text: text, 
                time: taskTime, 
                completed: false 
            });

            taskInput.value = ''; 
            taskTimeInput.value = '';
            saveData(); 
            renderTasks();
            updateInputAreaState();
            taskList.parentElement.scrollTop = taskList.parentElement.scrollHeight;
        }

        function toggleTask(id) {
            const activeList = getActiveList();
            if (!activeList) return;
            const task = activeList.tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveData(); 
                renderTasks();
            }
        }

        function deleteTask(id) {
            const activeList = getActiveList();
            if (!activeList) return;
            activeList.tasks = activeList.tasks.filter(t => t.id !== id);
            saveData(); 
            renderTasks();
            updateInputAreaState();
        }

        function openEditTimeModal(taskId) {
            const activeList = getActiveList();
            const task = activeList.tasks.find(t => t.id === taskId);
            if (!task) return;

            editingTaskId = taskId;
            editTimeTaskName.textContent = task.text;
            editTimeInput.value = task.time;
            editTimeModal.classList.remove('hidden');
            setTimeout(() => {
                editTimeInput.focus();
                editTimeInput.select();
            }, 100);
        }

        function closeEditTimeModal() {
            editTimeModal.classList.add('hidden');
            editingTaskId = null;
        }

        function saveTaskTime() {
            if (editingTaskId === null) return;
            const activeList = getActiveList();
            const task = activeList.tasks.find(t => t.id === editingTaskId);
            if (task) {
                const newTime = Number(editTimeInput.value);
                task.time = isNaN(newTime) || newTime < 0 ? 0 : newTime;
                saveData();
                renderTasks();
                updateInputAreaState();
            }
            closeEditTimeModal();
        }

        function openNewTabModal() {
            newTabSelect.innerHTML = '';
            
            const hasCleaning = lists.some(l => l.name === 'Cleaning');
            const hasSupplies = lists.some(l => l.name === 'Supplies');
            const hasDeepClean = lists.some(l => l.name === 'Deep Clean');

            if (!hasCleaning) {
                const opt = document.createElement('option');
                opt.value = 'Cleaning';
                opt.textContent = 'Cleaning Preset';
                newTabSelect.appendChild(opt);
            }
            if (!hasSupplies) {
                const opt = document.createElement('option');
                opt.value = 'Supplies';
                opt.textContent = 'Supplies Preset';
                newTabSelect.appendChild(opt);
            }
            if (!hasDeepClean) {
                const opt = document.createElement('option');
                opt.value = 'Deep Clean';
                opt.textContent = 'Deep Clean Preset';
                newTabSelect.appendChild(opt);
            }

            const customSimpleOpt = document.createElement('option');
            customSimpleOpt.value = 'custom_simple';
            customSimpleOpt.textContent = 'Custom Simple List';
            newTabSelect.appendChild(customSimpleOpt);

            const customTimedOpt = document.createElement('option');
            customTimedOpt.value = 'custom_timed';
            customTimedOpt.textContent = 'Custom Timed List';
            newTabSelect.appendChild(customTimedOpt);

            handleNewTabSelectChange();
            newTabModal.classList.remove('hidden');
        }

        function handleNewTabSelectChange() {
            const val = newTabSelect.value;
            if (val === 'custom_simple' || val === 'custom_timed') {
                newTabInput.classList.remove('hidden');
                newTabInput.value = '';
                setTimeout(() => newTabInput.focus(), 100);
            } else {
                newTabInput.classList.add('hidden');
            }
        }

        function closeNewTabModal() { 
            newTabModal.classList.add('hidden'); 
        }

        function createNewTab() {
            let name = '';
            let initialTasks = [];
            let listType = 'timed';
            const val = newTabSelect.value;

            if (val === 'custom_simple' || val === 'custom_timed') {
                name = newTabInput.value.trim();
                if (name === '') return;
                listType = (val === 'custom_timed') ? 'timed' : 'standard';
            } else {
                name = val;
                if (name === 'Cleaning') {
                    initialTasks = defaultCleaningTasks.map((t, index) => ({ id: index + 1, text: t.text, time: t.time, completed: false }));
                    listType = 'timed';
                } else if (name === 'Supplies') {
                    initialTasks = defaultSupplies.map((t, index) => ({ id: index + 1, text: t.text, time: t.time, completed: false }));
                    listType = 'standard';
                } else if (name === 'Deep Clean') {
                    initialTasks = defaultDeepClean.map((t, index) => ({ id: index + 1, text: t.text, time: t.time, completed: false }));
                    listType = 'timed';
                }
            }

            const nextTId = initialTasks.length > 0 ? Math.max(...initialTasks.map(t => t.id)) + 1 : 1;
            const newList = { id: nextListId++, name: name, type: listType, tasks: initialTasks, nextTaskId: nextTId };
            
            lists.push(newList);
            activeListId = newList.id;
            saveData();
            closeNewTabModal();
            renderTabs();
            renderTasks();
            updateInputAreaState();
        }

        function openEditTabModal() {
            const activeList = getActiveList();
            editTabInput.value = activeList.name;
            deleteTabBtn.style.display = lists.length <= 1 ? 'none' : 'block';
            editTabModal.classList.remove('hidden');
            deleteTabBtn.textContent = `Delete`;
            setTimeout(() => editTabInput.focus(), 100);
        }
        function closeEditTabModal() { editTabModal.classList.add('hidden'); }
        function saveEditTab() {
            const newName = editTabInput.value.trim();
            if (newName === '') return;
            const activeList = getActiveList();
            activeList.name = newName;
            saveData();
            closeEditTabModal();
            renderTabs();
        }
        function deleteCurrentTab() {
            if (lists.length <= 1) return;
            lists = lists.filter(l => l.id !== activeListId);
            activeListId = lists[0].id;
            saveData();
            closeEditTabModal();
            renderTabs();
            renderTasks();
            updateInputAreaState();
        }

        // Event Listeners
        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });
        taskTimeInput.addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });
        
        timerToggleBtn.addEventListener('click', toggleTimer);
        timerStopBtn.addEventListener('click', stopTimer);

        document.getElementById('cancel-tab-btn').addEventListener('click', closeNewTabModal);
        document.getElementById('save-tab-btn').addEventListener('click', createNewTab);
        newTabSelect.addEventListener('change', handleNewTabSelectChange);
        newTabInput.addEventListener('keypress', e => { if (e.key === 'Enter') createNewTab(); });

        document.getElementById('cancel-edit-tab-btn').addEventListener('click', closeEditTabModal);
        document.getElementById('save-edit-tab-btn').addEventListener('click', saveEditTab);
        deleteTabBtn.addEventListener('click', deleteCurrentTab);
        editTabInput.addEventListener('keypress', e => { if (e.key === 'Enter') saveEditTab(); });

        // Edit Time Modal Listeners
        document.getElementById('cancel-time-btn').addEventListener('click', closeEditTimeModal);
        document.getElementById('save-time-btn').addEventListener('click', saveTaskTime);
        editTimeInput.addEventListener('keypress', e => { if (e.key === 'Enter') saveTaskTime(); });

        // Initial render
        renderTabs();
        renderTasks();
        initSortableTasks();
        updateInputAreaState();

    </script>
</body>
</html>
