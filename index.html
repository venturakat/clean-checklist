<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="now what?">
    <title>now what?</title>

    <!-- PWA / Home Screen Support -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SortableJS for mobile-friendly drag and drop (pinned version) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --hint-color: #999999;
            --button-color: #3390ec;
            --button-text-color: #ffffff;
            --secondary-bg-color: #f4f4f5;
            --destructive-text-color: #e53935;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-color: #212121;
                --text-color: #ffffff;
                --hint-color: #aaaaaa;
                --button-color: #8774e1;
                --button-text-color: #ffffff;
                --secondary-bg-color: #0f0f0f;
                --destructive-text-color: #ff595a;
                color-scheme: dark;
            }
        }
        :root[data-theme="dark"] {
            --bg-color: #212121;
            --text-color: #ffffff;
            --hint-color: #aaaaaa;
            --button-color: #8774e1;
            --button-text-color: #ffffff;
            --secondary-bg-color: #0f0f0f;
            --destructive-text-color: #ff595a;
            color-scheme: dark;
        }

        html, body { height: 100%; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            overscroll-behavior-y: none;
            display: flex;
            flex-direction: column;
            /* Keep content clear of the notch / home indicator in standalone mode */
            padding: calc(1rem + env(safe-area-inset-top, 0px)) calc(1rem + env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) calc(1rem + env(safe-area-inset-left, 0px));
            box-sizing: border-box;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background-color: var(--hint-color); border-radius: 10px; }

        /* Tailwind's bg-opacity / border-opacity don't apply to arbitrary var() colors,
           so the translucent tints are defined here with color-mix. */
        .bg-hint-soft   { background-color: color-mix(in srgb, var(--hint-color) 20%, transparent); }
        .bg-danger-soft { background-color: color-mix(in srgb, var(--destructive-text-color) 15%, transparent); }
        .bg-accent-soft { background-color: color-mix(in srgb, var(--button-color) 18%, transparent); }
        .border-soft    { border-color: color-mix(in srgb, var(--hint-color) 20%, transparent); }
        .border-faint   { border-color: color-mix(in srgb, var(--hint-color) 10%, transparent); }
        .hover-danger-soft:hover { background-color: color-mix(in srgb, var(--destructive-text-color) 10%, transparent); }

        /* Smooth momentum scrolling for iOS */
        .tab-scroll-container {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .tab-scroll-container::-webkit-scrollbar { display: none; }

        .sortable-ghost { opacity: 0.4; }

        /* Custom dropdown arrow indicator */
        .custom-select-wrapper { position: relative; }
        .custom-select-wrapper::after {
            content: "";
            position: absolute;
            right: 0.75rem;
            top: 50%;
            width: 0.55rem;
            height: 0.55rem;
            border-right: 2px solid var(--hint-color);
            border-bottom: 2px solid var(--hint-color);
            transform: translateY(-70%) rotate(45deg);
            pointer-events: none;
        }

        /* Smooth tab transition styling */
        #task-container {
            touch-action: pan-y;
            will-change: transform;
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
        }
        #task-container.swiping { transition: none !important; }

        #toast {
            bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="max-w-md w-full mx-auto flex flex-col flex-1 min-h-0 gap-4">

        <!-- Header -->
        <header class="py-2 shrink-0">
            <h1 class="text-2xl font-bold">now what?</h1>
            <p class="text-[var(--hint-color)] text-sm mt-1">Get shit done. Or don’t.</p>
        </header>

        <!-- Tabs Area (Drag & Drop Enabled) -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1 shrink-0 tab-scroll-container" id="tab-bar">
            <!-- Tabs injected via JS -->
        </div>

        <!-- Timer Bar (Only visible for timed lists) -->
        <div id="timer-container" class="hidden bg-[var(--secondary-bg-color)] px-3 py-3 rounded-2xl flex items-center justify-between shrink-0 shadow-sm border border-faint gap-2">
            <div class="flex items-center gap-1.5 min-w-0">
                <svg id="global-timer-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[var(--destructive-text-color)] shrink-0 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="timer-display" class="text-base font-mono font-bold tracking-tight truncate tabular-nums">00:00:00</span>
            </div>
            <div class="flex items-center gap-1 shrink-0">
                <button id="timer-toggle-btn" class="bg-[var(--button-color)] text-[var(--button-text-color)] px-2.5 py-1.5 rounded-xl font-semibold text-xs active:scale-95 transition-transform shadow-sm">Start</button>
                <button id="timer-stop-btn" class="bg-hint-soft text-[var(--text-color)] px-2 py-1.5 rounded-xl font-semibold text-xs active:scale-95 transition-transform" title="Reset Timer">Reset</button>
                <button id="uncheck-all-btn" class="bg-danger-soft text-[var(--destructive-text-color)] px-2 py-1.5 rounded-xl font-semibold text-xs active:scale-95 transition-transform" title="Uncheck all tasks">Uncheck</button>
            </div>
        </div>

        <!-- Input Area (Hidden for Planners) -->
        <div id="global-input-area" class="flex gap-2 w-full shrink-0 items-center">
            <input
                type="text"
                id="task-input"
                placeholder="Add new..."
                aria-label="New item"
                class="flex-1 bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all min-w-0"
            >
            <input
                type="number"
                id="task-time-input"
                placeholder="Mins"
                min="1"
                max="300"
                inputmode="numeric"
                pattern="[0-9]*"
                aria-label="Minutes"
                class="w-20 bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-3 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all text-center font-medium shrink-0"
                title="Approximate time in minutes"
            >
            <!-- Pill Tracker Specific Inputs -->
            <input
                type="text"
                id="pill-dose-input"
                placeholder="Dose"
                aria-label="Dose"
                class="hidden w-20 bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-3 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all text-center font-medium shrink-0"
                title="Dosage (e.g., 10mg, 1 pill)"
            >
            <div id="pill-time-wrapper" class="hidden custom-select-wrapper shrink-0">
                <select
                    id="pill-time-select"
                    aria-label="Time of day"
                    class="bg-[var(--secondary-bg-color)] text-[var(--text-color)] rounded-xl pl-3 pr-8 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all text-sm font-medium border border-soft appearance-none cursor-pointer"
                >
                    <option value="morning">Morning</option>
                    <option value="day">Day</option>
                    <option value="night">Night</option>
                </select>
            </div>

            <button
                id="add-btn"
                aria-label="Add"
                class="bg-[var(--button-color)] text-[var(--button-text-color)] rounded-xl px-4 py-3 font-semibold shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>

        <!-- Swipable Checklist Container (the only scrolling region) -->
        <div id="task-container" class="flex-1 min-h-0 overflow-y-auto">
            <ul id="task-list" class="flex flex-col gap-2 pb-20">
                <!-- Tasks injected via JS -->
            </ul>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center text-center mt-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-[var(--hint-color)] mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                </svg>
                <p class="text-[var(--hint-color)]">Your tab is empty.<br>Add some items to get started!</p>
            </div>
        </div>
    </div>

    <!-- Toast (replaces blocking alert()) -->
    <div id="toast" role="status" aria-live="polite" class="fixed left-1/2 -translate-x-1/2 z-[60] opacity-0 pointer-events-none translate-y-2 bg-[var(--text-color)] text-[var(--bg-color)] px-4 py-2.5 rounded-xl shadow-lg text-sm font-semibold max-w-[90vw] text-center"></div>

    <!-- New Tab Modal -->
    <div id="new-tab-modal" class="modal hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[var(--bg-color)] p-6 rounded-2xl w-full max-w-sm flex flex-col gap-4 shadow-xl border border-[var(--secondary-bg-color)]">
            <h2 class="text-xl font-bold">Create New Tab</h2>

            <div class="custom-select-wrapper w-full">
                <select
                    id="new-tab-select"
                    aria-label="Tab type"
                    class="w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all appearance-none cursor-pointer pr-10 border border-soft font-medium"
                >
                    <!-- Options injected via JS -->
                </select>
            </div>

            <!-- Planner Date Dropdown (Shown only for Daily Planner) -->
            <div id="new-tab-date-wrapper" class="hidden custom-select-wrapper w-full">
                <select
                    id="new-tab-date-select"
                    aria-label="Planner date"
                    class="w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all appearance-none cursor-pointer pr-10 border border-soft font-medium"
                >
                    <!-- Options generated via JS -->
                </select>
            </div>

            <!-- Custom Tab Name Input (Shown for normal lists) -->
            <input
                type="text"
                id="new-tab-input"
                placeholder="Enter tab name..."
                class="hidden w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all"
            >

            <div class="flex gap-2 justify-end mt-2">
                <button id="cancel-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold text-[var(--hint-color)] hover:bg-[var(--secondary-bg-color)] transition-colors">Cancel</button>
                <button id="save-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold bg-[var(--button-color)] text-[var(--button-text-color)] shadow-sm active:scale-95 transition-transform">Create</button>
            </div>
        </div>
    </div>

    <!-- Manage Tab Modal (Rename / Delete) -->
    <div id="edit-tab-modal" class="modal hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[var(--bg-color)] p-6 rounded-2xl w-full max-w-sm flex flex-col gap-4 shadow-xl border border-[var(--secondary-bg-color)]">
            <h2 class="text-xl font-bold">Manage Tab</h2>
            <input
                type="text"
                id="edit-tab-input"
                placeholder="Tab name..."
                class="w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all"
            >
            <div class="flex gap-2 justify-between mt-2">
                <button id="delete-tab-btn" class="px-4 py-2.5 rounded-xl font-semibold text-[var(--destructive-text-color)] bg-danger-soft transition-colors">Delete</button>
                <div class="flex gap-2">
                    <button id="cancel-edit-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold text-[var(--hint-color)] hover:bg-[var(--secondary-bg-color)] transition-colors">Cancel</button>
                    <button id="save-edit-tab-btn" class="px-5 py-2.5 rounded-xl font-semibold bg-[var(--button-color)] text-[var(--button-text-color)] shadow-sm active:scale-95 transition-transform">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Task Time / Dose Modal -->
    <div id="edit-time-modal" class="modal hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-[var(--bg-color)] p-6 rounded-2xl w-full max-w-sm flex flex-col gap-4 shadow-xl border border-[var(--secondary-bg-color)]">
            <h2 id="edit-modal-title" class="text-xl font-bold">Edit Item Details</h2>
            <p id="edit-time-task-name" class="text-sm text-[var(--hint-color)] truncate"></p>
            <input
                type="text"
                id="edit-time-input"
                placeholder="Value"
                class="w-full bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all font-medium text-center text-lg"
            >
            <div class="flex gap-2 justify-end mt-2">
                <button id="cancel-time-btn" class="px-5 py-2.5 rounded-xl font-semibold text-[var(--hint-color)] hover:bg-[var(--secondary-bg-color)] transition-colors">Cancel</button>
                <button id="save-time-btn" class="px-5 py-2.5 rounded-xl font-semibold bg-[var(--button-color)] text-[var(--button-text-color)] shadow-sm active:scale-95 transition-transform">Save</button>
            </div>
        </div>
    </div>

    <script>
        const defaultCleaningTasks = [
            { text: "Vacuuming the floors", time: 15 },

            { text: "Dishes", time: 10 },
            { text: "Kitchen surfaces", time: 10 },

        ];

        const defaultDeepClean = [
            { text: "Vacuuming the floors", time: 15 },

            { text: "Washing the cat bed", time: 15 },
            { text: "Washing decorative textile", time: 15 },
            { text: "Dusting the kitchen", time: 10 },

            { text: "Under the sink cabinets", time: 15 },

            { text: "Baseboards behind the furniture", time: 20 },

            { text: "Wash the towels & rugs", time: 10 },
            { text: "Wash the bedsheets", time: 5 },
            { text: "Trash", time: 5 }
        ];

        const defaultGroceries = [
            { text: "Fresh milk", status: 'in_stock' },
            { text: "Eggs", status: 'low' },
            { text: "Butter", status: 'in_stock' },
            { text: "Greek yogurt", status: 'in_stock' },
            { text: "Cheddar cheese", status: 'in_stock' },
            { text: "Sourdough bread", status: 'out_of_stock' },

            { text: "Tomatoes", status: 'in_stock' },
            { text: "Garlic & onions", status: 'in_stock' },
