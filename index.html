<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clean Checklist</title>

    <!-- PWA Meta Tags for Home Screen Installation -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://venturakat.github.io/clean-checklist/icon.png">

    <!-- SortableJS Library for Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        /* iOS-Style Light Theme (Default) */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --hint-color: #8e8e93;
            --button-color: #007aff;
            --button-text-color: #ffffff;
            --secondary-bg: #f2f2f7;
            --border-color: #e5e5ea;
            --drag-shadow: rgba(0, 0, 0, 0.15);
        }

        /* Native System Dark Mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-color: #ffffff;
                --hint-color: #ebebf5;
                --button-color: #0a84ff;
                --secondary-bg: #1c1c1e;
                --border-color: #38383a;
                --drag-shadow: rgba(255, 255, 255, 0.1);
            }
        }

        /* Global Reset and Body Styling */
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none; /* Prevents iOS bounce */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header & Greeting */
        header { padding: 20px 20px 10px 20px; }
        h1 { margin: 0; font-size: 24px; font-weight: 700; }

        /* Tabs Navigation */
        .tabs-container {
            display: flex;
            align-items: center;
            overflow-x: auto;
            padding: 10px 20px;
            gap: 10px;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tabs-container { -ms-overflow-style: none; scrollbar-width: none; }

        .tab {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: var(--secondary-bg);
            color: var(--text-color);
            border: none;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .tab.active {
            background-color: var(--button-color);
            color: var(--button-text-color);
        }
        
        .delete-list-btn {
            margin-left: 8px;
            padding-left: 8px;
            border-left: 1px solid rgba(255,255,255,0.4);
            font-size: 18px;
            line-height: 1;
            opacity: 0.8;
        }

        .add-tab-btn {
            background-color: transparent;
            color: var(--button-color);
            font-size: 22px;
            padding: 0 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* Main Content List */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
            padding-bottom: 20px;
        }
        
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 10px;
            margin: 0 -10px; /* Expands touch area */
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
            transition: background-color 0.2s;
        }
        .task-item:last-child { border-bottom: none; }
        
        /* Drag and Drop Styling */
        .sortable-ghost {
            opacity: 0.3;
            background-color: var(--secondary-bg);
        }
        .sortable-drag {
            box-shadow: 0 10px 20px var(--drag-shadow);
            border-radius: 12px;
            z-index: 100;
            border-bottom: none;
        }
        
        .task-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            cursor: pointer;
        }
        
        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--button-color);
            cursor: pointer;
        }
        
        .task-text {
            font-size: 17px;
            transition: color 0.2s, text-decoration 0.2s;
        }
        .task-text.completed {
            text-decoration: line-through;
            color: var(--hint-color);
        }
        
        .delete-btn {
            color: #ff3b30;
            background: none;
            border: none;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            padding: 4px 10px;
            opacity: 0.8;
        }

        /* Input Area for New Tasks */
        .input-area {
            display: flex;
            padding: 16px 20px 24px 20px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-color);
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--secondary-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }
        .input-area input::placeholder { color: var(--hint-color); }
        .input-area button {
            padding: 0 20px;
            border: none;
            border-radius: 12px;
            background: var(--button-color);
            color: var(--button-text-color);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }

        /* Modal for creating a new list */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--bg-color);
            padding: 24px;
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-content h3 { margin: 0; font-size: 18px; }
        .modal-content input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--secondary-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-actions button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-cancel { background: transparent; color: var(--hint-color); }
        .btn-save { background: var(--button-color); color: var(--button-text-color); }
    </style>
</head>
<body>

    <header>
        <h1 id="greeting">Stay productive!</h1>
    </header>

    <div class="tabs-container" id="tabsContainer">
        <!-- Tabs injected here by JS -->
    </div>

    <div class="content" id="taskList">
        <!-- Tasks injected here by JS -->
    </div>

    <div class="input-area">
        <input type="text" id="newTaskInput" placeholder="Add a new item...">
        <button id="addTaskBtn">Add</button>
    </div>

    <!-- New List Modal -->
    <div class="modal" id="newListModal">
        <div class="modal-content">
            <h3>Create New List</h3>
            <input type="text" id="newListName" placeholder="E.g., Groceries">
            <div class="modal-actions">
                <button class="btn-cancel" id="cancelListBtn">Cancel</button>
                <button class="btn-save" id="saveListBtn">Create</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Default Lists Configuration
        const defaultTasks = [
            "Vacuuming the floors", "Dusting the kitchen", "Dishes", 
            "Kitchen surfaces", "Window boards", "Table", "Mirrors", 
            "Lamps", "Change the bedsheets", "Sofa", "Ironing", 
            "Dusting the rooms", "Baseboards", "Toilet", "Litterboxes", 
            "Shower", "Vanity area", "Bathroom sink", "Vacuuming", 
            "Floors", "Wash the towels & rugs", "Wash the bedsheets", "Trash"
        ];
        const defaultSupplies = [
            "Gloves", "Sponges", "Toilet paper", "Domestos", 
            "Cilit", "Barkeeper's friend", "Pronto spray", "Floor soap"
        ];

        // 2. State Management (Local Storage)
        let appData = JSON.parse(localStorage.getItem('cleanChecklistData'));
        
        if (!appData || !appData.lists || appData.lists.length === 0) {
            appData = {
                lists: [
                    { id: 1, name: "Cleaning", tasks: defaultTasks.map((t, i) => ({ id: i, text: t, completed: false })) },
                    { id: 2, name: "Supplies", tasks: defaultSupplies.map((t, i) => ({ id: i + 100, text: t, completed: false })) }
                ],
                activeListId: 1,
                nextTaskId: 200,
                nextListId: 3
            };
            saveData();
        }

        let activeListId = appData.activeListId || appData.lists[0].id;

        function saveData() {
            appData.activeListId = activeListId;
            localStorage.setItem('cleanChecklistData', JSON.stringify(appData));
        }

        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // 3. Render Functions
        const tabsContainer = document.getElementById('tabsContainer');
        const taskList = document.getElementById('taskList');
        const newTaskInput = document.getElementById('newTaskInput');
        
        function renderTabs() {
            tabsContainer.innerHTML = '';
            
            appData.lists.forEach(list => {
                const btn = document.createElement('button');
                btn.className = `tab ${list.id === activeListId ? 'active' : ''}`;
                btn.innerText = list.name;
                
                if (list.id === activeListId && appData.lists.length > 1) {
                    const deleteSpan = document.createElement('span');
                    deleteSpan.innerHTML = ' &times;';
                    deleteSpan.className = 'delete-list-btn';
                    deleteSpan.onclick = (e) => {
                        e.stopPropagation();
                        deleteList(list.id, list.name);
                    };
                    btn.appendChild(deleteSpan);
                }

                btn.onclick = () => {
                    activeListId = list.id;
                    saveData();
                    triggerHaptic();
                    renderTabs();
                    renderTasks();
                };
                tabsContainer.appendChild(btn);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'add-tab-btn';
            addBtn.innerText = '+';
            addBtn.onclick = () => {
                document.getElementById('newListModal').classList.add('show');
                document.getElementById('newListName').focus();
            };
            tabsContainer.appendChild(addBtn);
        }

        function renderTasks() {
            taskList.innerHTML = '';
            const activeList = appData.lists.find(l => l.id === activeListId);
            
            if (!activeList || activeList.tasks.length === 0) {
                taskList.innerHTML = `<p style="color: var(--hint-color); text-align: center; margin-top: 40px;">No items in this list yet.</p>`;
                return;
            }

            activeList.tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = 'task-item';
                div.dataset.id = task.id; 
                
                div.innerHTML = `
                    <div class="task-left" onclick="toggleTask(${task.id})">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask(${task.id})">
                        <span class="task-text ${task.completed ? 'completed' : ''}">${task.text}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">×</button>
                `;
                taskList.appendChild(div);
            });
        }

        // 4. Initialize Drag and Drop (SortableJS)
        new Sortable(taskList, {
            animation: 150,
            delay: 200,
            delayOnTouchOnly: true,
            ghostClass: 'sortable-ghost',
            dragClass: 'sortable-drag',
            onEnd: function (evt) {
                if (evt.oldIndex === evt.newIndex) return;

                const activeList = appData.lists.find(l => l.id === activeListId);
                
                const movedItem = activeList.tasks.splice(evt.oldIndex, 1)[0];
                activeList.tasks.splice(evt.newIndex, 0, movedItem);
                
                saveData();
                triggerHaptic();
            }
        });

        // 5. Task and List Actions
        function deleteList(id, name) {
            if (confirm(`Are you sure you want to delete the "${name}" list?`)) {
                appData.lists = appData.lists.filter(l => l.id !== id);
                activeListId = appData.lists[0].id;
                saveData();
                triggerHaptic();
                renderTabs();
                renderTasks();
            }
        }

        function toggleTask(id) {
            const list = appData.lists.find(l => l.id === activeListId);
            const task = list.tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveData();
                triggerHaptic();
                renderTasks();
            }
        }

        function deleteTask(id) {
            const list = appData.lists.find(l => l.id === activeListId);
            list.tasks = list.tasks.filter(t => t.id !== id);
            saveData();
            triggerHaptic();
            renderTasks();
        }

        document.getElementById('addTaskBtn').onclick = () => {
            const text = newTaskInput.value.trim();
            if (text) {
                const list = appData.lists.find(l => l.id === activeListId);
                list.tasks.push({ id: appData.nextTaskId++, text: text, completed: false });
                newTaskInput.value = '';
                saveData();
                triggerHaptic();
                renderTabs();
                renderTasks();
                taskList.scrollTop = taskList.scrollHeight;
            }
        };

        newTaskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('addTaskBtn').click();
        });

        // 6. Modal Logic
        const modal = document.getElementById('newListModal');
        const newListNameInput = document.getElementById('newListName');
        
        document.getElementById('cancelListBtn').onclick = () => {
            modal.classList.remove('show');
            newListNameInput.value = '';
        };

        document.getElementById('saveListBtn').onclick = () => {
            const name = newListNameInput.value.trim();
            if (name) {
                const newListId = appData.nextListId++;
                appData.lists.push({ id: newListId, name: name, tasks: [] });
                activeListId = newListId;
                saveData();
                triggerHaptic();
                modal.classList.remove('show');
                newListNameInput.value = '';
                renderTabs();
                renderTasks();
            }
        };

        // Initial Render
        renderTabs();
        renderTasks();
    </script>
</body>
</html>
