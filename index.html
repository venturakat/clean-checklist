            { text: "Pasta", status: 'in_stock' },
            { text: "Oatmeal", status: 'in_stock' },
            { text: "Sparkling water", status: 'low' }
        ];

        const defaultPills = [
            { text: "Multivitamin", dose: "1 pill", section: "morning", completed: false },
            { text: "Vitamin D3", dose: "2000 IU", section: "morning", completed: false },
            { text: "Omega 3", dose: "1000mg", section: "day", completed: false },
            { text: "Magnesium", dose: "400mg", section: "night", completed: false }
        ];

        const PILL_SECTIONS = [
            { key: 'morning', title: '☀️ Morning (up to 12 PM)' },
            { key: 'day', title: '🌤️ Day (12 PM - 6 PM)' },
            { key: 'night', title: '🌙 Night (6 PM - 12 AM)' }
        ];
        const PLANNER_BLOCKS = [
            { key: 'morning', title: 'Morning Block' },
            { key: 'afternoon', title: 'Afternoon Block' },
            { key: 'evening', title: 'Evening Block' }
        ];

        // Storage keys keep their original "clean checklist" names so existing saved lists survive the rename
        const STORAGE_KEY = 'cleanChecklistMultiData';
        const TIMERS_KEY = 'cleanChecklistTimers';
        const PILL_RESET_KEY = 'cleanAppLastPillReset';

        let lists = [];
        let activeListId = 1;
        let nextListId = 4;
        let sortableTasksInstances = [];
        let sortableTabsInstance = null;
        let isDragging = false;

        // Timers are timestamp-based so they stay accurate when the phone locks
        // or the tab is throttled, and they survive an app reload.
        // key: "<listId>" for timed lists, "<listId>_<section>" for planner blocks
        let listTimers = {};
        let editingTaskId = null;

        // ---------- Storage (never let a storage error break the app) ----------
        function storageGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function storageSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable or full */ }
        }

        function saveData() {
            storageSet(STORAGE_KEY, JSON.stringify({ lists: lists, activeListId: activeListId }));
        }

        function saveTimers() {
            const out = {};
            Object.entries(listTimers).forEach(([k, t]) => {
                out[k] = { base: t.base, isRunning: t.isRunning, startedAt: t.startedAt };
            });
            storageSet(TIMERS_KEY, JSON.stringify(out));
        }

        function buildDefaultLists() {
            const cleaningTasks = defaultCleaningTasks.map((t, index) => ({ id: index + 1, text: t.text, time: t.time, completed: false }));
            const groceriesTasks = defaultGroceries.map((t, index) => ({ id: index + 1, text: t.text, status: t.status, completed: false }));
            const pillTasks = defaultPills.map((t, index) => ({ id: index + 1, text: t.text, dose: t.dose, section: t.section, completed: false }));
            return [
                { id: 1, name: 'Cleaning', type: 'timed', tasks: cleaningTasks, nextTaskId: cleaningTasks.length + 1 },
                { id: 2, name: 'Groceries', type: 'shopping', tasks: groceriesTasks, nextTaskId: groceriesTasks.length + 1 },
                { id: 3, name: 'Pills', type: 'pill', tasks: pillTasks, nextTaskId: pillTasks.length + 1 }
            ];
        }

        function loadData() {
            let parsed = null;
            try {
                const raw = storageGet(STORAGE_KEY);
                if (raw) parsed = JSON.parse(raw);
            } catch (e) {
                parsed = null; // corrupted data: fall back to defaults instead of a blank screen
            }

            if (parsed && Array.isArray(parsed.lists) && parsed.lists.length > 0) {
                lists = parsed.lists.filter(l => l && typeof l === 'object');
                lists.forEach(l => {
                    if (!Array.isArray(l.tasks)) l.tasks = [];
                    if (!l.type) {
                        l.type = (l.name === 'Household' || l.name === 'Supplies' || l.name === 'Groceries') ? 'shopping' : 'timed';
                    }
                    if (l.name === 'Supplies') l.name = 'Household';

                    l.tasks.forEach(t => {
                        if ((l.type === 'timed' || l.type === 'planner') && t.time === undefined) t.time = 5;
                        if (l.type === 'shopping' && !t.status) t.status = t.completed ? 'out_of_stock' : 'in_stock';
                        if (l.type === 'pill') {
                            if (!t.section) t.section = 'morning';
                            if (t.dose === undefined) t.dose = '1 pill';
                        }
                        if (l.type === 'planner' && !t.section) t.section = 'morning';
                    });

                    // Make sure new task ids never collide with existing ones
                    const maxTaskId = l.tasks.reduce((m, t) => Math.max(m, Number(t.id) || 0), 0);
                    if (!l.nextTaskId || l.nextTaskId <= maxTaskId) l.nextTaskId = maxTaskId + 1;
                });
            }

            if (lists.length === 0) {
                lists = buildDefaultLists();
                activeListId = 1;
            } else {
                activeListId = parsed.activeListId;
            }

            // A stale activeListId left no tab highlighted and broke timer controls
            if (!lists.some(l => l.id === activeListId)) activeListId = lists[0].id;
            nextListId = Math.max(...lists.map(l => l.id)) + 1;
            saveData();

            try {
                const rawTimers = JSON.parse(storageGet(TIMERS_KEY) || '{}');
                Object.entries(rawTimers).forEach(([k, t]) => {
                    const listId = parseInt(k, 10);
                    if (!lists.some(l => l.id === listId)) return;
                    listTimers[k] = {
                        base: Number(t.base) || 0,
                        isRunning: !!t.isRunning && !!t.startedAt,
                        startedAt: Number(t.startedAt) || 0
                    };
                });
            } catch (e) { listTimers = {}; }
        }

        loadData();

        // ---------- Helpers ----------
        function getActiveList() { return lists.find(l => l.id === activeListId) || lists[0]; }

        function onEnter(el, handler) {
            el.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); handler(); }
            });
        }

        let toastTimeout = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-2');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.add('opacity-0', 'translate-y-2'), 3500);
            if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
        }

        // ---------- Pills ----------
        function isPillOverdue(task) {
            if (task.completed) return false;
            const currentHour = new Date().getHours();
            const section = task.section || 'morning';
            if (section === 'morning' && currentHour >= 12) return true;
            if (section === 'day' && currentHour >= 18) return true;
            return false;
        }

        function listHasOverduePills(list) {
            if (!list || list.type !== 'pill') return false;
            return list.tasks.some(task => isPillOverdue(task));
        }

        function checkAndResetPillTrackers() {
            const todayStr = new Date().toDateString();
            const lastResetDate = storageGet(PILL_RESET_KEY);

            if (lastResetDate !== todayStr) {
                lists.forEach(l => {
                    if (l.type === 'pill') l.tasks.forEach(t => t.completed = false);
                });
                storageSet(PILL_RESET_KEY, todayStr);
                saveData();
                return true;
            }
            return false;
        }

        checkAndResetPillTrackers();

        // Once a minute: daily pill reset + overdue badges. Skip while the user is dragging.
        setInterval(() => {
            if (isDragging) return;
            const didReset = checkAndResetPillTrackers();
            const activeList = getActiveList();
            if (activeList && (activeList.type === 'pill' || didReset)) renderTasks();
            renderTabs(false);
        }, 60000);

        // ---------- Timers ----------
        const globalInputArea = document.getElementById('global-input-area');
        const taskInput = document.getElementById('task-input');
        const taskTimeInput = document.getElementById('task-time-input');
        const pillDoseInput = document.getElementById('pill-dose-input');
        const pillTimeWrapper = document.getElementById('pill-time-wrapper');
        const pillTimeSelect = document.getElementById('pill-time-select');
        const addBtn = document.getElementById('add-btn');
        const taskList = document.getElementById('task-list');
        const taskContainer = document.getElementById('task-container');
        const emptyState = document.getElementById('empty-state');
        const tabBar = document.getElementById('tab-bar');

        const timerContainer = document.getElementById('timer-container');
        const timerDisplay = document.getElementById('timer-display');
        const timerToggleBtn = document.getElementById('timer-toggle-btn');
        const timerStopBtn = document.getElementById('timer-stop-btn');
        const uncheckAllBtn = document.getElementById('uncheck-all-btn');
        const globalTimerIcon = document.getElementById('global-timer-icon');

        const newTabModal = document.getElementById('new-tab-modal');
        const newTabSelect = document.getElementById('new-tab-select');
        const newTabInput = document.getElementById('new-tab-input');
        const newTabDateWrapper = document.getElementById('new-tab-date-wrapper');
        const newTabDateSelect = document.getElementById('new-tab-date-select');

        const editTabModal = document.getElementById('edit-tab-modal');
        const editTabInput = document.getElementById('edit-tab-input');
        const deleteTabBtn = document.getElementById('delete-tab-btn');

        const editTimeModal = document.getElementById('edit-time-modal');
        const editModalTitle = document.getElementById('edit-modal-title');
        const editTimeTaskName = document.getElementById('edit-time-task-name');
        const editTimeInput = document.getElementById('edit-time-input');

        function calculateTotalSeconds(list, section = null) {
            if (!list || (list.type !== 'timed' && list.type !== 'planner')) return 0;
            let activeUncompletedTasks = list.tasks.filter(t => !t.completed);
            if (section) activeUncompletedTasks = activeUncompletedTasks.filter(t => t.section === section);
            const totalMins = activeUncompletedTasks.reduce((sum, t) => sum + (Number(t.time) || 0), 0);
            return Math.round(totalMins * 60);
        }

        function formatTime(totalSeconds) {
            totalSeconds = Math.max(0, Math.floor(totalSeconds));
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function timerKey(list, section) {
            return list.type === 'planner' ? `${list.id}_${section}` : String(list.id);
        }

        function getListTimer(key) {
            if (!listTimers[key]) listTimers[key] = { base: 0, isRunning: false, startedAt: 0 };
            return listTimers[key];
        }

        function timerElapsed(timer) {
            return timer.isRunning ? timer.base + Math.floor((Date.now() - timer.startedAt) / 1000) : timer.base;
        }

        function setTimerElapsed(timer, secs) {
            timer.base = Math.max(0, Math.floor(secs));
            if (timer.isRunning) timer.startedAt = Date.now();
        }

        function timerTotalFor(key) {
            const [idPart, section] = key.split('_');
            const list = lists.find(l => l.id === parseInt(idPart, 10));
            if (!list) return null;
            return { list, section: section || null, total: calculateTotalSeconds(list, section || null) };
        }

        function runTimer(key) {
            const info = timerTotalFor(key);
            if (!info) return;
            const timer = getListTimer(key);
            if (info.total - timerElapsed(timer) <= 0) return;
            timer.isRunning = true;
            timer.startedAt = Date.now();
            saveTimers();
        }

        function pauseTimerKey(key) {
            const timer = getListTimer(key);
            timer.base = timerElapsed(timer);
            timer.isRunning = false;
            saveTimers();
        }

        function resetTimerKey(key) {
            const timer = getListTimer(key);
            timer.base = 0;
            timer.isRunning = false;
            saveTimers();
        }

        function clearTimersForList(listId) {
            Object.keys(listTimers).forEach(k => {
                if (parseInt(k, 10) === listId) delete listTimers[k];
            });
            saveTimers();
        }

        // When a task is checked off (or deleted) while a countdown is active, remove the
        // time already spent on it from the elapsed counter. Previously the task's full
        // duration was subtracted from the total AND its spent time stayed in "elapsed",
        // so the remaining time dropped twice.
        function creditTaskTime(list, task) {
            if (!list || task.completed || (list.type !== 'timed' && list.type !== 'planner')) return;
            const key = timerKey(list, task.section);
            if (!listTimers[key]) return;
            const timer = listTimers[key];
            const elapsed = timerElapsed(timer);
            if (elapsed <= 0) return;

            let start = 0;
            for (const t of list.tasks) {
                if (t.completed) continue;
                if (list.type === 'planner' && t.section !== task.section) continue;
                if (t === task) break;
                start += (Number(t.time) || 0) * 60;
            }
            const duration = (Number(task.time) || 0) * 60;
            const consumed = Math.min(duration, Math.max(0, elapsed - start));
            setTimerElapsed(timer, elapsed - consumed);
            saveTimers();
        }

        function setToggleButtonState(running) {
            if (running) {
                timerToggleBtn.textContent = 'Pause';
                timerToggleBtn.className = 'bg-[var(--destructive-text-color)] text-white px-2.5 py-1.5 rounded-xl font-semibold text-xs active:scale-95 transition-transform shadow-sm';
                globalTimerIcon.classList.remove('hidden');
                globalTimerIcon.classList.add('animate-pulse');
            } else {
                timerToggleBtn.textContent = 'Start';
                timerToggleBtn.className = 'bg-[var(--button-color)] text-[var(--button-text-color)] px-2.5 py-1.5 rounded-xl font-semibold text-xs active:scale-95 transition-transform shadow-sm';
                globalTimerIcon.classList.add('hidden');
                globalTimerIcon.classList.remove('animate-pulse');
            }
        }

        function refreshTimedDisplay() {
            const activeList = getActiveList();
            if (!activeList || activeList.type !== 'timed') return;
            const timer = getListTimer(String(activeList.id));
            const total = calculateTotalSeconds(activeList);
            if (timerElapsed(timer) > total) setTimerElapsed(timer, total);
            timerDisplay.textContent = formatTime(total - timerElapsed(timer));
            setToggleButtonState(timer.isRunning);
            updateTaskVisualGradients();
        }

        // One ticker drives every running timer (timed lists and planner blocks).
        function tick() {
            let finishedActive = false;
            Object.keys(listTimers).forEach(key => {
                const timer = listTimers[key];
                if (!timer.isRunning) return;
                const info = timerTotalFor(key);
                if (!info) { delete listTimers[key]; saveTimers(); return; }

                if (timerElapsed(timer) >= info.total) {
                    timer.base = info.total;
                    timer.isRunning = false;
                    saveTimers();
                    const label = info.section ? `${info.list.name}: ${info.section} block` : info.list.name;
                    showToast(`Time is up for ${label}! Great job.`);
                    if (info.list.id === activeListId) finishedActive = true;
                }
            });

            const activeList = getActiveList();
            if (!activeList) return;
            if (finishedActive && activeList.type === 'planner') {
                renderTasks();
            } else if (activeList.type === 'timed') {
                refreshTimedDisplay();
            } else if (activeList.type === 'planner') {
                PLANNER_BLOCKS.forEach(block => {
                    const timer = getListTimer(`${activeList.id}_${block.key}`);
                    const total = calculateTotalSeconds(activeList, block.key);
                    const display = document.getElementById(`planner-timer-${block.key}`);
                    if (display) display.textContent = formatTime(total - timerElapsed(timer));
                    updatePlannerVisualGradients(block.key);
                });
            }
        }
        setInterval(tick, 1000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

        function toggleTimer() {
            const key = String(activeListId);
            if (getListTimer(key).isRunning) pauseTimerKey(key);
            else runTimer(key);
            refreshTimedDisplay();
        }

        function stopTimer() {
            resetTimerKey(String(activeListId));
            refreshTimedDisplay();
        }

        function togglePlannerTimer(section) {
            const key = `${activeListId}_${section}`;
            if (getListTimer(key).isRunning) pauseTimerKey(key);
            else runTimer(key);
            renderTasks();
        }

        function resetPlannerTimer(section) {
            resetTimerKey(`${activeListId}_${section}`);
            renderTasks();
        }

        function uncheckAllTasks() {
            const activeList = getActiveList();
            if (!activeList) return;

            activeList.tasks.forEach(t => {
                t.completed = false;
                if (activeList.type === 'shopping') t.status = 'in_stock';
            });

            if (activeList.type === 'timed') {
                resetTimerKey(String(activeList.id));
            } else if (activeList.type === 'planner') {
                PLANNER_BLOCKS.forEach(b => resetTimerKey(`${activeList.id}_${b.key}`));
            }

            saveData();
            renderTasks();
            renderTabs(false);
            updateInputAreaState();
        }

        function paintProgress(li, task, elapsedSecs, startSecs) {
            if (task.completed) {
                li.style.background = 'rgba(34, 197, 94, 0.2)';
                li.style.borderColor = 'rgba(34, 197, 94, 0.4)';
                return;
            }
            const duration = (Number(task.time) || 0) * 60;
            // Progress stays visible while paused, not only while running
            if (elapsedSecs > startSecs && duration > 0) {
                const p = Math.min(1, (elapsedSecs - startSecs) / duration) * 100;
                li.style.background = `linear-gradient(to right, rgba(239, 68, 68, 0.45) ${p}%, var(--secondary-bg-color) ${p}%)`;
            } else {
                li.style.background = 'var(--secondary-bg-color)';
            }
        }

        function paintTaskProgress(tasks, container, timer) {
            const elapsedSecs = timerElapsed(timer);
            let accumulatedSecs = 0;
            tasks.forEach(task => {
                const li = container.querySelector(`li[data-id="${task.id}"]`);
                const start = accumulatedSecs;
                if (!task.completed) accumulatedSecs += (Number(task.time) || 0) * 60;
                if (li) paintProgress(li, task, elapsedSecs, start);
            });
        }

        function updateTaskVisualGradients() {
            const activeList = getActiveList();
            if (!activeList || activeList.type !== 'timed') return;
            paintTaskProgress(activeList.tasks, taskList, getListTimer(String(activeList.id)));
        }

        function updatePlannerVisualGradients(section) {
            const activeList = getActiveList();
            if (!activeList || activeList.type !== 'planner') return;
            const zone = taskList.querySelector(`ul[data-section="${section}"]`);
            if (!zone) return;
            const timer = getListTimer(`${activeList.id}_${section}`);
            const total = calculateTotalSeconds(activeList, section);
            if (timerElapsed(timer) > total) setTimerElapsed(timer, total);
            paintTaskProgress(activeList.tasks.filter(t => t.section === section), zone, timer);
        }

        // ---------- Input area ----------
        function updateInputAreaState() {
            const activeList = getActiveList();

            taskTimeInput.classList.add('hidden');
            pillDoseInput.classList.add('hidden');
            pillTimeWrapper.classList.add('hidden');
            timerContainer.classList.add('hidden');
            timerContainer.classList.remove('flex');

            if (activeList.type === 'planner') {
                globalInputArea.classList.add('hidden');
                globalInputArea.classList.remove('flex');
                return;
            }

            globalInputArea.classList.remove('hidden');
            globalInputArea.classList.add('flex');

            if (activeList.type === 'timed') {
                taskTimeInput.classList.remove('hidden');
                timerContainer.classList.remove('hidden');
                timerContainer.classList.add('flex');
                taskInput.placeholder = "Add a timed task...";
                refreshTimedDisplay();
            } else if (activeList.type === 'pill') {
                pillDoseInput.classList.remove('hidden');
                pillTimeWrapper.classList.remove('hidden');
                taskInput.placeholder = "Pill name...";
            } else if (activeList.type === 'shopping') {
                taskInput.placeholder = "Add item...";
            } else {
                taskInput.placeholder = "Add a task...";
            }
        }

        // ---------- Tabs ----------
        function renderTabs(scrollToActive = true) {
            tabBar.innerHTML = '';

            lists.forEach(list => {
                const isActive = list.id === activeListId;
                const isOverduePillTab = listHasOverduePills(list);

                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-5 py-2 rounded-full text-sm font-semibold transition-all active:scale-95 shrink-0 shadow-sm flex items-center gap-1.5 cursor-grab active:cursor-grabbing ${
                    isActive
                        ? 'bg-[var(--button-color)] text-[var(--button-text-color)]'
                        : 'bg-[var(--secondary-bg-color)] text-[var(--text-color)] opacity-80 hover:opacity-100 border border-soft'
                }`;
                btn.dataset.id = list.id;

                if (isOverduePillTab) {
                    const dot = document.createElement('span');
                    dot.className = 'w-2.5 h-2.5 bg-[var(--destructive-text-color)] rounded-full animate-pulse shadow-sm';
                    btn.appendChild(dot);
                }

                // textContent, not innerHTML: tab names are user input
                const label = document.createElement('span');
                label.textContent = list.name;
                btn.appendChild(label);

                if (isActive) {
                    btn.insertAdjacentHTML('beforeend', `<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 opacity-70 ml-0.5" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>`);
                    btn.setAttribute('aria-label', `${list.name} (tap to rename or delete)`);
                }

                btn.onclick = () => {
                    if (btn.dataset.dragging === "true") return;
                    if (list.id === activeListId) openEditTabModal();
                    else switchTab(list.id);
                };
                tabBar.appendChild(btn);
            });

            const addTabBtn = document.createElement('button');
            addTabBtn.className = 'add-tab-btn flex items-center justify-center w-9 h-9 ml-1 rounded-full bg-[var(--secondary-bg-color)] text-[var(--button-color)] shrink-0 active:scale-95 transition-transform border border-soft';
            addTabBtn.setAttribute('aria-label', 'New tab');
            addTabBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>`;
            addTabBtn.onclick = openNewTabModal;
            tabBar.appendChild(addTabBtn);

            // Only scroll the bar when the active tab changed; the minute ticker used to
            // yank the tab bar (and on iOS the whole page) every 60 seconds.
            if (scrollToActive) {
                const activeBtn = tabBar.querySelector(`button[data-id="${activeListId}"]`);
                if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            initSortableTabs();
        }

        function switchTab(targetListId) {
            activeListId = targetListId;
            saveData();
            renderTabs();
            renderTasks();
            updateInputAreaState();
            taskContainer.scrollTop = 0;
        }

        // ---------- Task elements ----------
        const DRAG_ICON = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" /></svg>`;
        const CHECK_ICON = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>`;
        const TRASH_ICON = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>`;

        function createDragHandle() {
            const dragHandle = document.createElement('div');
            dragHandle.className = 'drag-handle py-2 pr-2 -ml-1 text-[var(--hint-color)] opacity-40 hover:opacity-100 cursor-grab active:cursor-grabbing touch-none shrink-0';
            dragHandle.innerHTML = DRAG_ICON;
            return dragHandle;
        }

        function createDeleteButton(task) {
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'p-2 text-[var(--hint-color)] hover:text-[var(--destructive-text-color)] active:scale-90 transition-all rounded-lg';
            deleteBtn.setAttribute('aria-label', `Delete ${task.text}`);
            deleteBtn.onclick = (e) => { e.stopPropagation(); deleteTask(task.id); };
            deleteBtn.innerHTML = TRASH_ICON;
            return deleteBtn;
        }

        function createPillTaskElement(task) {
            const overdue = isPillOverdue(task);
            const li = document.createElement('li');
            li.className = `flex items-center justify-between p-3 rounded-xl transition-all duration-200 group ${
                task.completed
                    ? 'bg-[var(--secondary-bg-color)] opacity-75'
                    : overdue
                        ? 'bg-rose-500/15 border border-rose-500/40'
                        : 'bg-[var(--secondary-bg-color)]'
            }`;
            li.dataset.id = task.id;

            const leftDiv = document.createElement('div');
            leftDiv.className = 'flex items-center gap-2 flex-1 min-w-0';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'flex items-center gap-3 flex-1 cursor-pointer min-w-0';
            contentDiv.onclick = () => toggleTask(task.id);

            const checkbox = document.createElement('div');
            checkbox.className = `w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center transition-colors duration-200 ${
                task.completed
                    ? 'border-green-500 bg-green-500 text-white'
                    : overdue
                        ? 'border-rose-500 bg-rose-500/20 text-transparent'
                        : 'border-[var(--hint-color)] text-transparent'
            }`;
            checkbox.innerHTML = CHECK_ICON;

            const span = document.createElement('span');
            span.className = `text-base select-none truncate transition-all duration-200 ${
                task.completed
                    ? 'line-through text-[var(--hint-color)]'
                    : overdue
                        ? 'text-[var(--destructive-text-color)] font-semibold'
                        : 'text-[var(--text-color)]'
            }`;
            span.textContent = task.text;

            contentDiv.appendChild(checkbox);
            contentDiv.appendChild(span);
            leftDiv.appendChild(createDragHandle());
            leftDiv.appendChild(contentDiv);

            const rightSideDiv = document.createElement('div');
            rightSideDiv.className = 'flex items-center gap-2 shrink-0 ml-2';

            if (overdue) {
                const overdueBadge = document.createElement('span');
                overdueBadge.className = 'bg-[var(--destructive-text-color)] text-white text-[10px] uppercase tracking-wider font-bold px-2 py-0.5 rounded-full';
                overdueBadge.textContent = 'Overdue';
                rightSideDiv.appendChild(overdueBadge);
            }

            // Always shown, so a cleared dose can still be edited
            const doseSpan = document.createElement('button');
            doseSpan.className = 'bg-accent-soft text-[var(--text-color)] text-xs font-semibold px-2 py-1 rounded-lg cursor-pointer hover:underline';
            doseSpan.textContent = task.dose || 'Dose';
            doseSpan.title = "Tap to edit dose";
            doseSpan.onclick = (e) => { e.stopPropagation(); openEditTimeModal(task.id); };
            rightSideDiv.appendChild(doseSpan);

            rightSideDiv.appendChild(createDeleteButton(task));
            li.appendChild(leftDiv);
            li.appendChild(rightSideDiv);
            return li;
        }

        function createStandardTaskElement(task, listType) {
            const li = document.createElement('li');
            li.dataset.id = task.id;

            const leftDiv = document.createElement('div');
            leftDiv.className = 'flex items-center gap-2 flex-1 min-w-0';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'flex items-center gap-3 flex-1 cursor-pointer min-w-0';
            contentDiv.onclick = () => toggleTask(task.id);

            if (listType === 'shopping') {
                const status = task.status || 'in_stock';

                let bgStyle = 'bg-emerald-500/10 border border-emerald-500/30';
                let badgeStyle = 'bg-emerald-500 text-white';
                let statusText = 'In Stock';
                let iconHtml = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>`;

                if (status === 'low') {
                    bgStyle = 'bg-amber-500/15 border border-amber-500/40';
                    badgeStyle = 'bg-amber-500 text-white';
                    statusText = 'Low';
                    iconHtml = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>`;
                } else if (status === 'out_of_stock') {
                    bgStyle = 'bg-rose-500/15 border border-rose-500/40';
                    badgeStyle = 'bg-rose-500 text-white';
                    statusText = 'Ran Out';
                    iconHtml = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>`;
                }

                li.className = `flex items-center justify-between p-3 rounded-xl transition-all duration-200 group ${bgStyle}`;
                const badge = document.createElement('div');
                badge.className = `px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1 shrink-0 transition-transform active:scale-95 shadow-sm ${badgeStyle}`;
                badge.innerHTML = `${iconHtml}<span>${statusText}</span>`;

                const span = document.createElement('span');
                span.className = `text-[var(--text-color)] text-base font-medium select-none truncate transition-all duration-200 ${status === 'out_of_stock' ? 'font-bold' : ''}`;
                span.textContent = task.text;

                contentDiv.appendChild(badge);
                contentDiv.appendChild(span);
            } else {
                li.className = `flex items-center justify-between p-3 rounded-xl bg-[var(--secondary-bg-color)] border border-transparent transition-all duration-200 group ${task.completed ? 'opacity-75' : ''}`;

                const checkbox = document.createElement('div');
                checkbox.className = `w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center transition-colors duration-200 ${
                    task.completed ? 'border-green-500 bg-green-500 text-white' : 'border-[var(--hint-color)] text-transparent'
                }`;
                checkbox.innerHTML = CHECK_ICON;

                const span = document.createElement('span');
                span.className = `text-base select-none truncate transition-all duration-200 ${task.completed ? 'line-through text-[var(--hint-color)]' : 'text-[var(--text-color)]'}`;
                span.textContent = task.text;

                contentDiv.appendChild(checkbox);
                contentDiv.appendChild(span);
            }

            leftDiv.appendChild(createDragHandle());
            leftDiv.appendChild(contentDiv);

            const rightSideDiv = document.createElement('div');
            rightSideDiv.className = 'flex items-center gap-3 shrink-0 ml-2';

            // Always shown for timed items: when the time was set to 0 the badge
            // used to disappear, leaving no way to edit it again.
            if (listType === 'timed' || listType === 'planner') {
                const timeSpan = document.createElement('button');
                timeSpan.className = 'text-[var(--destructive-text-color)] text-sm font-bold cursor-pointer hover:underline py-1 px-1.5 rounded hover-danger-soft transition-colors tabular-nums';
                timeSpan.textContent = `${Number(task.time) || 0}m`;
                timeSpan.title = "Tap to edit time";
                timeSpan.onclick = (e) => { e.stopPropagation(); openEditTimeModal(task.id); };
                rightSideDiv.appendChild(timeSpan);
            }

            rightSideDiv.appendChild(createDeleteButton(task));

            li.appendChild(leftDiv);
            li.appendChild(rightSideDiv);
            return li;
        }

        // ---------- Rendering ----------
        function renderTasks() {
            const activeList = getActiveList();

            // Keep anything typed into planner inputs across re-renders
            const draft = {};
            taskList.querySelectorAll('input[id^="planner-"]').forEach(inp => { draft[inp.id] = inp.value; });
            const focusedId = document.activeElement && document.activeElement.id;

            taskList.innerHTML = '';

            const isEmpty = !activeList || (activeList.tasks.length === 0 && activeList.type !== 'planner');
            emptyState.classList.toggle('hidden', !isEmpty);
            emptyState.classList.toggle('flex', isEmpty);

            if (activeList && !isEmpty) {
                if (activeList.type === 'pill') {
                    // Each section is its own drop zone, so dragging a pill into another
                    // section moves it there. (Headers used to sit inside the sortable list
                    // and threw the drag indexes off.)
                    PILL_SECTIONS.forEach(sec => {
                        const block = document.createElement('li');
                        block.className = 'flex flex-col gap-2';

                        const header = document.createElement('div');
                        header.className = 'text-xs font-bold uppercase tracking-wider text-[var(--hint-color)] pt-3 pb-1 px-1';
                        header.textContent = sec.title;
                        block.appendChild(header);

                        const zone = document.createElement('ul');
                        zone.className = 'task-dropzone flex flex-col gap-2 min-h-[12px]';
                        zone.dataset.section = sec.key;
                        activeList.tasks
                            .filter(t => (t.section || 'morning') === sec.key)
                            .forEach(task => zone.appendChild(createPillTaskElement(task)));
                        block.appendChild(zone);
                        taskList.appendChild(block);
                    });

                } else if (activeList.type === 'planner') {
                    PLANNER_BLOCKS.forEach(block => {
                        const timer = getListTimer(`${activeList.id}_${block.key}`);
                        const totalSecs = calculateTotalSeconds(activeList, block.key);
                        if (timerElapsed(timer) > totalSecs) setTimerElapsed(timer, totalSecs);
                        const remaining = totalSecs - timerElapsed(timer);

                        const blockContainer = document.createElement('li');
                        blockContainer.className = 'mb-6 flex flex-col gap-2';

                        const header = document.createElement('div');
                        header.className = 'flex justify-between items-center mb-1 px-1 gap-2';
                        header.innerHTML = `
                            <h3 class="font-bold text-lg text-[var(--text-color)]">${block.title}</h3>
                            <div class="flex items-center gap-1.5 shrink-0 bg-[var(--secondary-bg-color)] px-2.5 py-1.5 rounded-xl border border-faint shadow-sm">
                                ${timer.isRunning ? `<svg class="h-3 w-3 text-[var(--destructive-text-color)] animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>` : ''}
                                <span id="planner-timer-${block.key}" class="font-mono font-bold text-sm tracking-tight tabular-nums">${formatTime(remaining)}</span>
                                <button data-action="toggle" class="${timer.isRunning ? 'bg-[var(--destructive-text-color)] text-white' : 'bg-[var(--button-color)] text-[var(--button-text-color)]'} text-xs px-2 py-1 rounded-lg font-semibold active:scale-95 transition-transform ml-1">${timer.isRunning ? 'Pause' : 'Start'}</button>
                                <button data-action="reset" class="bg-hint-soft text-[var(--text-color)] text-xs px-2 py-1 rounded-lg font-semibold active:scale-95 transition-transform">Reset</button>
                            </div>
                        `;
                        header.querySelector('[data-action="toggle"]').addEventListener('click', () => togglePlannerTimer(block.key));
                        header.querySelector('[data-action="reset"]').addEventListener('click', () => resetPlannerTimer(block.key));
                        blockContainer.appendChild(header);

                        const dropzone = document.createElement('ul');
                        dropzone.className = 'task-dropzone flex flex-col gap-2 min-h-[10px] pb-1';
                        dropzone.dataset.section = block.key;
                        activeList.tasks
                            .filter(t => t.section === block.key)
                            .forEach(task => dropzone.appendChild(createStandardTaskElement(task, 'planner')));
                        blockContainer.appendChild(dropzone);

                        const inputRow = document.createElement('div');
                        inputRow.className = 'flex gap-2 w-full mt-1 shrink-0 items-center';
                        inputRow.innerHTML = `
                            <input type="text" id="planner-input-${block.key}" placeholder="Add to ${block.title}..." aria-label="New task for ${block.title}" class="flex-1 bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all min-w-0 text-sm">
                            <input type="number" id="planner-time-${block.key}" placeholder="Mins" min="1" max="300" inputmode="numeric" aria-label="Minutes" class="w-16 bg-[var(--secondary-bg-color)] text-[var(--text-color)] placeholder-[var(--hint-color)] rounded-xl px-2 py-3 outline-none focus:ring-2 focus:ring-[var(--button-color)] transition-all text-center font-medium shrink-0 text-sm">
                            <button data-action="add" aria-label="Add to ${block.title}" class="bg-[var(--button-color)] text-[var(--button-text-color)] rounded-xl px-3 py-3 font-semibold shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                            </button>
                        `;
                        const tIn = inputRow.querySelector(`#planner-input-${block.key}`);
                        const mIn = inputRow.querySelector(`#planner-time-${block.key}`);
                        if (draft[tIn.id]) tIn.value = draft[tIn.id];
                        if (draft[mIn.id]) mIn.value = draft[mIn.id];
                        onEnter(tIn, () => addPlannerTask(block.key));
                        onEnter(mIn, () => addPlannerTask(block.key));
                        inputRow.querySelector('[data-action="add"]').addEventListener('click', () => addPlannerTask(block.key));

                        blockContainer.appendChild(inputRow);
                        taskList.appendChild(blockContainer);
                    });

                    PLANNER_BLOCKS.forEach(block => updatePlannerVisualGradients(block.key));

                    if (focusedId && focusedId.startsWith('planner-')) {
                        const el = document.getElementById(focusedId);
                        if (el) el.focus();
                    }
                } else {
                    activeList.tasks.forEach(task => {
                        taskList.appendChild(createStandardTaskElement(task, activeList.type));
                    });
                    updateTaskVisualGradients();
                }
            }
            initSortableTasks();
        }

        // ---------- Drag & drop ----------
        function initSortableTasks() {
            sortableTasksInstances.forEach(inst => inst.destroy());
            sortableTasksInstances = [];

            const activeList = getActiveList();
            if (!activeList || typeof Sortable === 'undefined') return;

            const common = {
                handle: '.drag-handle',
                animation: 200,
                delay: 100,
                delayOnTouchOnly: true,
                onStart: () => { isDragging = true; }
            };

            if (activeList.type === 'planner' || activeList.type === 'pill') {
                taskList.querySelectorAll('.task-dropzone').forEach(zone => {
                    const inst = new Sortable(zone, {
                        ...common,
                        group: `sections-${activeList.id}`,
                        onEnd: function (evt) {
                            isDragging = false;
                            const taskId = parseInt(evt.item.dataset.id, 10);
                            const task = activeList.tasks.find(t => t.id === taskId);
                            if (task) task.section = evt.to.dataset.section;

                            // Rebuild the array order from the DOM order across all sections
                            const order = Array.from(taskList.querySelectorAll('.task-dropzone li[data-id]'))
                                .map(node => parseInt(node.dataset.id, 10));
                            activeList.tasks.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));

                            saveData();
                            renderTasks();
                            renderTabs(false);
                        }
                    });
                    sortableTasksInstances.push(inst);
                });
            } else {
                const inst = new Sortable(taskList, {
                    ...common,
                    onEnd: function (evt) {
                        isDragging = false;
                        const { oldIndex, newIndex } = evt;
                        if (oldIndex !== newIndex) {
                            const [movedTask] = activeList.tasks.splice(oldIndex, 1);
                            activeList.tasks.splice(newIndex, 0, movedTask);
                            saveData();
                            renderTasks();
                        }
                    }
                });
                sortableTasksInstances.push(inst);
            }
        }

        function initSortableTabs() {
            if (sortableTabsInstance) sortableTabsInstance.destroy();
            if (typeof Sortable === 'undefined') return;
            sortableTabsInstance = new Sortable(tabBar, {
                animation: 200,
                draggable: 'button:not(.add-tab-btn)',
                filter: '.add-tab-btn',
                delay: 150,
                delayOnTouchOnly: true,
                onStart: function (evt) {
                    isDragging = true;
                    evt.item.dataset.dragging = "true";
                },
                onEnd: function (evt) {
                    isDragging = false;
                    setTimeout(() => { evt.item.dataset.dragging = "false"; }, 50);

                    const { oldIndex, newIndex } = evt;
                    if (oldIndex !== undefined && newIndex !== undefined && oldIndex !== newIndex) {
                        const [movedList] = lists.splice(oldIndex, 1);
                        lists.splice(newIndex, 0, movedList);
                        saveData();
                    }
                }
            });
        }

        // ---------- Task actions ----------
        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;

            const activeList = getActiveList();
            if (!activeList) return;

            const newTask = { id: activeList.nextTaskId++, text: text, completed: false };
            if (activeList.type === 'timed') {
                const mins = Number(taskTimeInput.value);
                newTask.time = mins > 0 ? mins : 5;
            } else if (activeList.type === 'shopping') {
                newTask.status = 'out_of_stock'; // new items go straight onto the "need to buy" list
            } else if (activeList.type === 'pill') {
                newTask.dose = pillDoseInput.value.trim() || '1 pill';
                newTask.section = pillTimeSelect.value;
            }

            activeList.tasks.push(newTask);

            taskInput.value = '';
            taskTimeInput.value = '';
            pillDoseInput.value = '';
            saveData();
            renderTasks();
            renderTabs(false);
            updateInputAreaState();
            if (activeList.type !== 'pill') taskContainer.scrollTop = taskContainer.scrollHeight;
        }

        function addPlannerTask(section) {
            const activeList = getActiveList();
            if (!activeList || activeList.type !== 'planner') return;

            const textInput = document.getElementById(`planner-input-${section}`);
            const timeInput = document.getElementById(`planner-time-${section}`);

            const text = textInput.value.trim();
            if (text === '') return;
            const mins = Number(timeInput.value);

            activeList.tasks.push({
                id: activeList.nextTaskId++,
                text: text,
                time: mins > 0 ? mins : 5,
                completed: false,
                section: section
            });

            textInput.value = '';
            timeInput.value = '';
            saveData();
            renderTasks();
            const again = document.getElementById(`planner-input-${section}`);
            if (again) again.focus();
        }

        function toggleTask(id) {
            const activeList = getActiveList();
            if (!activeList) return;
            const task = activeList.tasks.find(t => t.id === id);
            if (!task) return;

            if (activeList.type === 'shopping') {
                const currentStatus = task.status || 'in_stock';
                if (currentStatus === 'in_stock') task.status = 'low';
                else if (currentStatus === 'low') task.status = 'out_of_stock';
                else task.status = 'in_stock';
            } else {
                if (!task.completed) creditTaskTime(activeList, task);
                task.completed = !task.completed;
            }

            saveData();
            renderTasks();
            renderTabs(false);
            if (activeList.type === 'timed') updateInputAreaState();
        }

        function deleteTask(id) {
            const activeList = getActiveList();
            if (!activeList) return;
            const task = activeList.tasks.find(t => t.id === id);
            if (task) creditTaskTime(activeList, task);
            activeList.tasks = activeList.tasks.filter(t => t.id !== id);
            saveData();
            renderTasks();
            renderTabs(false);
            updateInputAreaState();
        }

        // ---------- Modals ----------
        function openModal(modal) { modal.classList.remove('hidden'); }
        function closeAllModals() {
            closeNewTabModal();
            closeEditTabModal();
            closeEditTimeModal();
        }

        function openEditTimeModal(taskId) {
            const activeList = getActiveList();
            const task = activeList.tasks.find(t => t.id === taskId);
            if (!task) return;

            editingTaskId = taskId;
            editTimeTaskName.textContent = task.text;

            if (activeList.type === 'pill') {
                editModalTitle.textContent = "Edit Pill Dose";
                editTimeInput.type = "text";
                editTimeInput.removeAttribute('inputmode');
                editTimeInput.value = task.dose || "1 pill";
            } else {
                editModalTitle.textContent = "Edit Task Time (Mins)";
                editTimeInput.type = "number";
                editTimeInput.setAttribute('inputmode', 'numeric');
                editTimeInput.min = "0";
                editTimeInput.value = Number(task.time) || 0;
            }

            openModal(editTimeModal);
            setTimeout(() => {
                editTimeInput.focus();
                try { editTimeInput.select(); } catch (e) {}
            }, 100);
        }

        function closeEditTimeModal() {
            editTimeModal.classList.add('hidden');
            editingTaskId = null;
        }

        function saveTaskTime() {
            if (editingTaskId === null) return;
            const activeList = getActiveList();
            const task = activeList.tasks.find(t => t.id === editingTaskId);
            if (task) {
                if (activeList.type === 'pill') {
                    task.dose = editTimeInput.value.trim() || '1 pill';
                } else {
                    const newTime = Number(editTimeInput.value);
                    task.time = isNaN(newTime) || newTime < 0 ? 0 : newTime;
                }
                saveData();
                renderTasks();
                renderTabs(false);
                updateInputAreaState();
            }
            closeEditTimeModal();
        }

        function populatePlannerDateOptions() {
            newTabDateSelect.innerHTML = '';
            const daysOfWeek = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

            // Next 14 days starting from today
            for (let i = 0; i < 14; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const label = `${daysOfWeek[d.getDay()]} ${d.getDate()}`;
                const option = document.createElement('option');
                option.value = label; // e.g., "MON 21"
                option.textContent = i === 0 ? `${label} (today)` : i === 1 ? `${label} (tomorrow)` : label;
                newTabDateSelect.appendChild(option);
            }
        }

        function openNewTabModal() {
            newTabSelect.innerHTML = '';
            const groups = [
                ['── LISTS ──', [['cat_timed', 'Timed Task List'], ['cat_simple', 'Simple Task List'], ['cat_shopping', 'Shopping List']]],
                ['── PLANNERS ──', [['cat_planner', 'Daily Planner']]],
                ['── TRACKERS ──', [['cat_pill', 'Pill Tracker']]],
                ['── PRESETS ──', [['Cleaning', 'Clean Preset'], ['Deep Clean', 'Deep Clean Preset'], ['Groceries', 'Groceries Preset'], ['Household', 'Household Preset'], ['Pills Preset', 'Pill Tracker Preset']]]
            ];
            groups.forEach(([label, options]) => {
                const group = document.createElement('optgroup');
                group.label = label;
                options.forEach(([value, text]) => {
                    const opt = document.createElement('option');
                    opt.value = value;
                    opt.textContent = text;
                    group.appendChild(opt);
                });
                newTabSelect.appendChild(group);
            });

            handleNewTabSelectChange();
            openModal(newTabModal);
        }

        function handleNewTabSelectChange() {
            const val = newTabSelect.value;
            newTabInput.classList.add('hidden');
            newTabDateWrapper.classList.add('hidden');

            if (val === 'cat_planner') {
                newTabDateWrapper.classList.remove('hidden');
                populatePlannerDateOptions();
            } else if (val.startsWith('cat_')) {
                newTabInput.classList.remove('hidden');
                newTabInput.value = '';
                setTimeout(() => newTabInput.focus(), 100);
            }
        }

        function closeNewTabModal() { newTabModal.classList.add('hidden'); }

        function createNewTab() {
            let name = '';
            let initialTasks = [];
            let listType = 'timed';
            const val = newTabSelect.value;

            if (val.startsWith('cat_')) {
                if (val === 'cat_planner') {
                    listType = 'planner';
                    name = newTabDateSelect.value;
                } else {
                    name = newTabInput.value.trim();
                    if (name === '') { newTabInput.focus(); return; }
                    if (val === 'cat_timed') listType = 'timed';
                    else if (val === 'cat_shopping') listType = 'shopping';
                    else if (val === 'cat_pill') listType = 'pill';
                    else listType = 'standard';
                }
            } else {
                name = val;
                if (name === 'Cleaning') {
                    initialTasks = defaultCleaningTasks.map((t, index) => ({ id: index + 1, text: t.text, time: t.time, completed: false }));
                    listType = 'timed';
                } else if (name === 'Deep Clean') {
                    initialTasks = defaultDeepClean.map((t, index) => ({ id: index + 1, text: t.text, time: t.time, completed: false }));
                    listType = 'timed';
                } else if (name === 'Groceries') {
                    initialTasks = defaultGroceries.map((t, index) => ({ id: index + 1, text: t.text, status: t.status, completed: false }));
                    listType = 'shopping';
                } else if (name === 'Household') {
                    initialTasks = defaultHousehold.map((t, index) => ({ id: index + 1, text: t.text, status: t.status, completed: false }));
                    listType = 'shopping';
                } else if (name === 'Pills Preset') {
                    name = 'Pills';
                    initialTasks = defaultPills.map((t, index) => ({ id: index + 1, text: t.text, dose: t.dose, section: t.section, completed: false }));
                    listType = 'pill';
                }
            }

            const newList = { id: nextListId++, name: name, type: listType, tasks: initialTasks, nextTaskId: initialTasks.length + 1 };

            lists.push(newList);
            closeNewTabModal();
            switchTab(newList.id);
        }

        // Delete asks for a second tap instead of confirm(), which some webviews block
        let deleteArmed = false;
        function resetDeleteButton() {
            deleteArmed = false;
            deleteTabBtn.textContent = 'Delete';
            deleteTabBtn.classList.remove('bg-[var(--destructive-text-color)]', 'text-white');
            deleteTabBtn.classList.add('bg-danger-soft', 'text-[var(--destructive-text-color)]');
        }

        function openEditTabModal() {
            const activeList = getActiveList();
            editTabInput.value = activeList.name;
            deleteTabBtn.style.display = lists.length <= 1 ? 'none' : 'block';
            resetDeleteButton();
            openModal(editTabModal);
            setTimeout(() => editTabInput.focus(), 100);
        }
        function closeEditTabModal() { editTabModal.classList.add('hidden'); resetDeleteButton(); }
        function saveEditTab() {
            const newName = editTabInput.value.trim();
            if (newName === '') return;
            getActiveList().name = newName;
            saveData();
            closeEditTabModal();
            renderTabs(false);
        }
        function deleteCurrentTab() {
            if (lists.length <= 1) return;
            if (!deleteArmed) {
                deleteArmed = true;
                const count = getActiveList().tasks.length;
                deleteTabBtn.textContent = count ? `Delete ${count} items?` : 'Tap to confirm';
                deleteTabBtn.classList.remove('bg-danger-soft', 'text-[var(--destructive-text-color)]');
                deleteTabBtn.classList.add('bg-[var(--destructive-text-color)]', 'text-white');
                return;
            }
            const removedIndex = lists.findIndex(l => l.id === activeListId);
            clearTimersForList(activeListId); // stop orphaned countdowns
            lists = lists.filter(l => l.id !== activeListId);
            closeEditTabModal();
            switchTab(lists[Math.max(0, removedIndex - 1)].id);
        }

        // ---------- Swipe between tabs ----------
        let touchStartX = 0;
        let touchStartY = 0;
        let touchCurrentX = 0;
        let isSwiping = false;

        function resetSwipeVisuals() {
            taskContainer.classList.remove('swiping');
            taskContainer.style.transform = '';
            taskContainer.style.opacity = '';
        }

        taskContainer.addEventListener('touchstart', (e) => {
            if (isDragging || e.touches.length > 1 || e.target.closest('.drag-handle, button, input, select')) {
                isSwiping = false;
                return;
            }
            touchStartX = touchCurrentX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isSwiping = true;
            taskContainer.classList.add('swiping');
        }, { passive: true });

        taskContainer.addEventListener('touchmove', (e) => {
            if (!isSwiping) return;
            if (isDragging) { isSwiping = false; resetSwipeVisuals(); return; }
            touchCurrentX = e.touches[0].clientX;
            const diffX = touchCurrentX - touchStartX;
            const diffY = e.touches[0].clientY - touchStartY;

            if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 10) {
                isSwiping = false;
                resetSwipeVisuals();
                return;
            }

            if (Math.abs(diffX) > 10) {
                taskContainer.style.transform = `translateX(${diffX * 0.4}px)`;
                taskContainer.style.opacity = `${1 - Math.abs(diffX) / 600}`;
            }
        }, { passive: true });

        function endSwipe(cancelled) {
            if (!isSwiping) return;
            isSwiping = false;
            resetSwipeVisuals();
            if (cancelled) return;

            const diffX = touchCurrentX - touchStartX;
            const threshold = 60;
            const currentIndex = lists.findIndex(l => l.id === activeListId);

            if (diffX < -threshold) {
                if (currentIndex < lists.length - 1) switchTab(lists[currentIndex + 1].id);
                else openNewTabModal();
            } else if (diffX > threshold && currentIndex > 0) {
                switchTab(lists[currentIndex - 1].id);
            }
        }
        taskContainer.addEventListener('touchend', () => endSwipe(false));
        taskContainer.addEventListener('touchcancel', () => endSwipe(true));

        // ---------- Wiring ----------
        addBtn.addEventListener('click', addTask);
        onEnter(taskInput, addTask);
        onEnter(taskTimeInput, addTask);
        onEnter(pillDoseInput, addTask);

        timerToggleBtn.addEventListener('click', toggleTimer);
        timerStopBtn.addEventListener('click', stopTimer);
        uncheckAllBtn.addEventListener('click', uncheckAllTasks);

        document.getElementById('cancel-tab-btn').addEventListener('click', closeNewTabModal);
        document.getElementById('save-tab-btn').addEventListener('click', createNewTab);
        newTabSelect.addEventListener('change', handleNewTabSelectChange);
        onEnter(newTabInput, createNewTab);

        document.getElementById('cancel-edit-tab-btn').addEventListener('click', closeEditTabModal);
        document.getElementById('save-edit-tab-btn').addEventListener('click', saveEditTab);
        deleteTabBtn.addEventListener('click', deleteCurrentTab);
        onEnter(editTabInput, saveEditTab);

        document.getElementById('cancel-time-btn').addEventListener('click', closeEditTimeModal);
        document.getElementById('save-time-btn').addEventListener('click', saveTaskTime);
        onEnter(editTimeInput, saveTaskTime);

        // Close modals by tapping the backdrop or pressing Escape
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', e => { if (e.target === modal) closeAllModals(); });
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllModals(); });

        renderTabs();
        renderTasks();
        updateInputAreaState();
    </script>
</body>
</html>
